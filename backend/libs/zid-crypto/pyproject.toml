[project]
name = "zid-crypto"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "cryptography>=43",
  "joserfc>=1.0",
  "zid-context",
  "zid-errors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_crypto"]
