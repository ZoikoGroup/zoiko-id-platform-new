[project]
name = "zid-outbox"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "aiokafka>=0.11",
  "sqlalchemy[asyncio]>=2.0",
  "zid-context",
  "zid-errors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_outbox"]
