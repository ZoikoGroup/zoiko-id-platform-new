[project]
name = "zid-app"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "zid-context",
  "zid-errors",
  "zid-db",
  "zid-telemetry",
  "fastapi>=0.115",
  "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_app"]
