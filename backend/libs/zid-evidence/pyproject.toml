[project]
name = "zid-evidence"
version = "0.0.0"
description = "Evidence integrity primitives: RFC 8785 JCS, algorithm-tagged digests, RFC 9162 Merkle proofs, signed checkpoints, offline bundle verifier (DEC-F2)"
requires-python = ">=3.13"
# Kept dependency-light on purpose: an external verifier installs only this and `cryptography`.
dependencies = [
  "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_evidence"]

[project.optional-dependencies]
# Verifying an RFC 3161 timestamp in a bundle (zid_evidence.timestamp); pure Python, so still easy for an auditor to install.
timestamps = ["pyasn1>=0.6", "pyasn1-modules>=0.4"]
