# P01 candidate capability catalogue (ZI-CHAT-CSR-008 section 04). CANDIDATES ONLY: every entry is EVIDENCE_PENDING / NOT_PUBLIC with no market
# or audience, because public website wording is not approval, test proof, pricing evidence or jurisdictional entitlement.
# Promotion needs the evidence named in Doc 08 (release commit, test evidence, approver, effective date) signed by the Product Release Owner.
capabilities:
  - {capability_id: CAP-001, display_name: "Passwordless access / passkeys", protocols: [WebAuthn, FIDO2]}  # CL-03; needs FIDO2 ceremony + RP test vectors, supported browsers, environments
  - {capability_id: CAP-002, display_name: "MFA and risk-based step-up"}  # CL-03/06; needs factor matrix, recovery rules, step-up and negative-path tests
  - {capability_id: CAP-003, display_name: "OIDC / OAuth 2.0 federation", protocols: [OIDC, OAuth2]}  # CL-03/04; needs discovery metadata, scopes, conformance, tenant enablement
  - {capability_id: CAP-004, display_name: "SAML and enterprise SSO", protocols: [SAML2]}  # CL-03/04; needs metadata, signature checks, SP/IdP profiles, live runbook
  - {capability_id: CAP-005, display_name: "SCIM provisioning and lifecycle", protocols: [SCIM2]}  # CL-03/04; needs provisioning tests, deprovisioning timing, schema and guides
  - {capability_id: CAP-006, display_name: "KYC person verification"}  # CL-05/06; needs approved supplier/flow, proofing levels, exceptions, regions
  - {capability_id: CAP-007, display_name: "KYB / company and ownership verification"}  # CL-05/06; needs registry coverage, beneficial owner rules, per-country basis
  - {capability_id: CAP-008, display_name: "Professional licenses / academic qualifications"}  # CL-05/06; needs authority issuer, validity/revocation, consent and fraud checks
