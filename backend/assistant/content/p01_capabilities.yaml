  - {capability_id: CAP-011, display_name: "Delegated authority / representation"}  # CL-02/08; needs scope, expiry, counterparty and authorization boundary tests
  - {capability_id: CAP-012, display_name: "Roles and policy decisions"}  # CL-03/08; needs approved role catalogue, permissions, deny tests and tenant scope
  - {capability_id: CAP-013, display_name: "Machine and API workload identity"}  # CL-04/10; needs issuer, credential rotation, revocation and tenant identity proof
  - {capability_id: CAP-014, display_name: "AI-agent identity and delegation"}  # CL-10; needs agent owner proof, action scope, tool denials and release entitlements
  - {capability_id: CAP-015, display_name: "Fraud / risk scoring and behavioral signals"}  # CL-06; needs model card, provenance, consent/lawful basis, audited quality
  - {capability_id: CAP-016, display_name: "Webhooks, SDKs and sandbox accounts"}  # CL-04; needs versioned SDK artifacts, signed docs, sample integration tests
  - {capability_id: CAP-017, display_name: "Device trust, binding and biometric options"}  # CL-03/06; needs device/platform assurance matrix, security and privacy validation
  - {capability_id: CAP-018, display_name: "Audit log and evidence export"}  # CL-06; needs provenance chain, audit isolation, permission model and retention
  - {capability_id: CAP-019, display_name: "Financial services / KYC portability"}  # CL-05/07; needs partner and regulator applicability per use case and country
  - {capability_id: CAP-020, display_name: "Telecom and marketplace verification"}  # CL-05/07; needs industry deployments, approved terms and actual pilots/releases
  - {capability_id: CAP-021, display_name: "EUDI wallet / cross-border interoperability"}  # CL-05/10; needs wallet scheme profile, member-state acceptance and lawful basis
  - {capability_id: CAP-022, display_name: "Global coverage, regional residency, sovereign deployment"}  # CL-05/06; needs hosted footprint, subprocessor map, legal/data residency sign-off
  - {capability_id: CAP-023, display_name: "Free / Business / Platform offers and SLA"}  # CL-07; needs approved plan/fee limits, eligibility, effective dates, contract SLAs
  - {capability_id: CAP-024, display_name: "ZoikoSuite / Zoikorum ecosystem integration"}  # CL-04/05; needs versioned integration contracts and product-specific release proof
  - {capability_id: CAP-025, display_name: "Verification vendors / third-party connectors"}  # CL-04/05; needs executed contracts, permitted country use, API parity and test evidence
