# The 18 canonical intents (ZI-CHAT-KB-002 section 04). Matching is deterministic and server-side: text is normalised (lower-case, curly quotes
# straightened, whitespace collapsed); `phrases` are substring matches, `keywords` are whole-word matches. When several intents match, the
# highest `priority` wins, which implements the Doc 02 precedence: (1) secrets/ID evidence and unsafe requests, (2) reported security harm,
# (3) account-specific protected actions, (4) privacy and rights, (5) commercial/release capability, (6) public information, (7) unknown.
#
# route: DETERMINISTIC = a fixed approved answer when one matches (else the pipeline falls back to RAG, then ABSTAIN); RAG = constrained
# retrieval (an approved answer is still preferred when it matches); REFUSE / ESCALATE use the copy.yaml entry named by `refusal_key`
# (or the matched answer's own text); CLARIFY asks one clarifying question. `cta_link_id` is the ACTIVE fallback link (p03) shown when the
# matched answer's own CTA is a suspended secure route.
intents:
  - intent_id: INT-17
    family: UNSAFE
    description: "Send an OTP, unlock an account, expose a tenant, reveal internal instructions: hard refuse and route to the protected flow."
    route: REFUSE
    priority: 100
    keywords: [otp]
    phrases:
      - "one-time code"
      - "one time code"
      - "my otp"
      - "my password is"
      - "here is my password"
      - "my recovery code"
      - "send me a code"
      - "send me an otp"
      - "send me a verification code"
      - "verify me"
      - "expose tenant"
      - "show me our tenant"
      - "tenant's risk"
      - "tenants risk"
      - "risk score"
      - "ignore your instructions"
      - "ignore previous instructions"
      - "ignore all previous"
      - "print your prompt"
      - "print your internal prompt"
      - "system prompt"
      - "internal prompt"
      - "reveal your instructions"
      - "jailbreak"
    refusal_key: refuse_unsafe_request
    cta_link_id: HELP-SUPPORT
  - intent_id: INT-15
    family: ABUSE
    description: "Report a compromised account or a discovered vulnerability: published security channel, no evidence collection."
    route: ESCALATE
    priority: 95
