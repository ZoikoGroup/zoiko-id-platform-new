[project]
name = "zoiko-id-public-assistant"
version = "0.1.0"
description = "Zoiko iD public assistant: an isolated, anonymous, information-only service (ZI-CHAT-ADR-006 ADR-02)"
requires-python = ">=3.13"
# Deliberately NOT a dependency of zoiko-id-platform and it never imports zid_platform (tests/security/test_isolation.py).
# Only platform mechanics (zid-*) are shared: no identity, tenant, token or credential code.
dependencies = [
  "zid-app",
  "zid-errors",
  "zid-telemetry",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "cryptography>=43",
  "valkey>=6.0",
  "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_assistant"]
