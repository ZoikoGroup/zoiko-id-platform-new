# Capability bands C1-C5 (ZID-ENG-DEC-008 v1.0, proposed for founder approval): the two matrices as the record prints them.
# M mandatory baseline, I included subject to catalogue quota, A optional paid add-on or contracted usage, - not included.
# Generated from the record's tables. `catalogue` names the Commercial Estate capability that carries the feature today (an
# engineering mapping for Commercial & Finance to confirm); the Estate stays authoritative for plan terms and quantities.
version: "ZID-ENG-DEC-008-v1.0"
# Engineering default: C1..C5 follow the order of the five existing plans. Commercial & Finance map them to signed SKUs.
bands: {C1: DEVELOPER, C2: LAUNCH, C3: BUSINESS, C4: SCALE, C5: ENTERPRISE}
# REPORT_ONLY: the Estate's plan capabilities decide and every divergence from this matrix is reported.
# ENFORCE: this matrix is also a gate (the stricter of the two wins).
band_matrix_enforcement: REPORT_ONLY
# How long a signed snapshot may be reused (seconds, 1 to 300). A plan, suspension, billing or override change ends it at once.
# 60 is an engineering default: the record asks for a bounded policy TTL and approves no number.
snapshot_ttl_seconds: 60
