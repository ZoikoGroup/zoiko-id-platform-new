    guardrail: "Do not include internal service chatter"
    existing_meter: null
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  agent.principal:
    example_unit: "Active agent identity"
    counts: "Distinct registered agent principal, per contracted metric"
    guardrail: "Never conflate with human seats"
    existing_meter: null
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  data.retention:
    example_unit: "Contracted optional capacity"
    counts: "Approved storage/retention above standard policy"
    guardrail: "Required evidence retention unaffected"
    existing_meter: null
