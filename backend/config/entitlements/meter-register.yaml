# Commercial meter register (ZID-ENG-DEC-008 v1.0 section 04): what counts, and the guardrail each meter must keep.
# No numerical cap, rate, automatic overage or included quantity is approved by the record. `priced: false` is the honest
# state; a meter without an approved price, limit or definition is never billed silently (see usage reservations).
version: "ZID-ENG-DEC-008-v1.0"
# The last four meters (credential.check, credential.sensitive_check, screening.check, screening.monitor_period) are NOT in the owner-ratified
# record's eight. The two credential ones were added by CR-070 on the engineering owner's instruction of 2026-11-12 as definitions, and on
# 2026-11-16 are backed by two USAGE-ONLY meters (CREDENTIAL_CHECK and CREDENTIAL_SENSITIVE_CHECK), as the screening ones are by CR-090: recorded as
# usage facts, unpriced, no quota, `bill_on_commit: false`, and no SKU behind them. Billing them still needs the CFO and CCO price numbers and the
# owners' ruling on the recording point; until then a quote line for them is refused (PRICE_MISSING) and nothing is billed silently.
meters:
  auth.mau:
    example_unit: "Monthly active distinct principal"
    counts: "Deduplicated active human principal per billing period"
    guardrail: "Exclude service principals; define dedup and retries"
    existing_meter: MAH
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  idv.check:
    example_unit: "Verification attempt / completion"
    counts: "Provider-backed identity proofing event; unit must be defined"
    guardrail: "Chargeable outcome only as explicitly contracted"
    existing_meter: null
    existing_sku: ZID-IDV
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  kyb.check:
    example_unit: "Company lookup / enhanced screening"
    counts: "Provider-backed case or search by product"
    guardrail: "No undisclosed repeat-check or refresh fees"
    existing_meter: null
    existing_sku: ZID-KYB
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  credential.issue:
    example_unit: "Issued credential"
    counts: "Committed, signed credential creation"
    guardrail: "No charge for failed signing / duplicates"
    existing_meter: VC_ISSUED
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  credential.verify:
    example_unit: "Validation transaction"
    counts: "Authenticated verifier request under policy"
    guardrail: "Cache, retries and replay treatment documented"
    existing_meter: VC_PRESENTED
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  api.request:
    example_unit: "Billable API call"
    counts: "Authenticated successful service request per catalog"
    guardrail: "Do not include internal service chatter"
    existing_meter: null
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  agent.principal:
    example_unit: "Active agent identity"
    counts: "Distinct registered agent principal, per contracted metric"
    guardrail: "Never conflate with human seats"
    existing_meter: null
    existing_sku: null
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  data.retention:
    example_unit: "Contracted optional capacity"
    counts: "Approved storage/retention above standard policy"
    guardrail: "Required evidence retention unaffected"
    existing_meter: null
    existing_sku: ZID-EVD
    hard_quota: false
    # true: committing a reservation also records one billable event for `existing_meter`, once (key = the reservation).
    # Off until the owners rule that this API, not the operation itself, is the recording point (owner pack item 8).
    bill_on_commit: false
    priced: false
  credential.check:
    example_unit: "Claim check against a source"
    counts: "One completed check of one claim (academic, license, certificate, CPD, employment, insurance) that reached a source or whose issuer outreach concluded; counted once per logical check, not per retry"
    guardrail: "No charge for a check refused before a source is asked (no pack, no contract, bad claim) or when the source was unavailable; provider pass-through shown separately, never discounted"
    existing_meter: CREDENTIAL_CHECK
    existing_sku: null
    hard_quota: false
    # A usage meter stands behind it (CR-070): recorded, never rated or invoiced. Billing stays off until the owners rule on the recording point and the CFO and CCO approve a price per region.
    bill_on_commit: false
    priced: false
  screening.check:
    example_unit: "Screening decision"
    counts: "One automated sanctions, PEP or adverse-media screening decision of one case, recorded once per decision (a reviewer's ruling on it is not another)"
    guardrail: "A check is not a monitoring period and a monitoring period is not a check; neither is rated or invoiced until the owners approve a unit and a price"
    existing_meter: SCREEN_CHECK
    existing_sku: null
    hard_quota: false
    # Off until the owners rule on the recording point and the CFO and CCO approve a price per region (CR-090).
    bill_on_commit: false
    priced: false
  screening.monitor_period:
    example_unit: "Case-month under continuous monitoring"
    counts: "One case under continuous monitoring for one UTC month, however many rescreens run in it"
    guardrail: "Separate from the check each rescreen performs; no charge for a case that is not monitored"
    existing_meter: SCREEN_MONITOR_PERIOD
    existing_sku: null
    hard_quota: false
    # Off until the owners rule on the recording point and the CFO and CCO approve a price per region (CR-090).
    bill_on_commit: false
    priced: false
  credential.sensitive_check:
    example_unit: "Regulator adverse-finding check"
    counts: "One completed sensitive-category check"
    guardrail: "Only under a recorded basis, an authorized user and a reviewer; priced separately from standard checks"
    existing_meter: CREDENTIAL_SENSITIVE_CHECK
    existing_sku: null
    hard_quota: false
    # A usage meter stands behind it (CR-070): recorded, never rated or invoiced. Billing stays off until the owners rule on the recording point and the CFO and CCO approve a price per region.
    bill_on_commit: false
    priced: false
