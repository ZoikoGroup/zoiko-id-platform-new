# Proof documents for a company claim (WF-13B section 06, AT-12). Versioned configuration, not tenant data.
# status: PROPOSED (founder and Legal/Privacy approval pending)
# version: 0.1.0
#
# max_bytes: the largest file accepted (10 MiB is a proposal; Legal and Security decide).
# types: media types accepted, as the file's own bytes show them (never the file name).
# kinds: what the applicant says a document is; a reviewer reads it as a claim, never as proof of a fact.
# per_case_limit: how many proofs one claim may hold.
# A proof is evidence for a reviewer. It never verifies a company by itself.
# A file is refused before anything is stored if the tenant's residency does not allow the cell to hold it, and it is scanned
# before it is stored: a deployed environment without a scanner refuses uploads (nothing is stored unscanned).

version: 0.1.0
max_bytes: 10485760
per_case_limit: 20
types:
  - application/pdf
  - image/png
  - image/jpeg
kinds:
  - CERTIFICATE_OF_INCORPORATION
  - REGISTER_EXTRACT
  - LETTER_OF_AUTHORITY
  - OWNERSHIP_CHART
  - BOARD_RESOLUTION
  - OTHER
