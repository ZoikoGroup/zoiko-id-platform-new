# Which credential types may be accepted as evidence of WHO A PERSON IS (ZID-GAP-001 v2.0, Document 03 section 06 PERSON_IDENTITY).
# A type listed here is only half of the rule: the issuer must ALSO be in the typed trust table for that exact type (an issuer is never trusted for
# everything), and the credential must be bound to the holder presenting it. Nothing is trusted by default: add a type only when the owners have
# decided which issuers (a national eID scheme, an EU wallet provider, a bank) may vouch for a person, and why.
# The one entry below is a SAMPLE name so the route has something to demonstrate; it names no issuer and trusts nothing by itself.
version: 0.1.0
status: SAMPLE
credential_types:
  - PersonIdentificationData
  # The EU Person Identification Data types (the names the EUDI wallet rulebooks use). A PID is accepted as identity only when an official-register
  # attestation lists its issuer as a PID provider for the request's Member State on the issuance date (Document 03 RCG-G11); the typed trust table
  # still has to pin the issuer too. With no attestation recorded, a PID is refused (PID_PROVIDER_NOT_LISTED).
  - eu.europa.ec.eudi.pid.1
  - urn:eudi:pid:1
