# Approval tiers and the actions in each (ZID-ENG-DEC-010 v1.0, ZID-ENG-DEC-011 v1.0, ZID-ENG-DEC-012 v1.0; all proposed for founder approval).
# The record's own lists: customer and platform A2 actions (Decision 11 sections 02, 03), the actions that are never allowed (Decision 12
# section 02) and the immediate defensive actions (Decision 11 sections 03, 08). The backend classifies the action; the UI never does.
# Security and Product lock this registry under version control; a change here changes the policy version of every new case.
#
#   tier        A0 routine (no vote, no case), A1 sensitive (requester + one independent), A2 critical (requester + two independent), FORBIDDEN (never, whatever
#               signatures exist), CONTAINMENT (immediate defensive action, no case).
#   scope       CUSTOMER (a tenant governs it) or PLATFORM (Zoiko operations govern it; a tenant case cannot run it)
#   executor    the name of the registered executor that applies an approved case; null means nothing applies it yet, so a case for
#               the action is refused (nothing is approved that cannot run)
#   approvers   the roles that may vote: OWNER, APPROVER, and REVIEWER (an appointed independent reviewer, Decision 12)
#   request_matrix  the role-matrix action (ZID-ENG-DEC-007) the requester must be allowed to prepare; null means an Owner or Admin
#   gate        the additional gate the record states for the action (shown to the approver, recorded in the evidence)
version: "ZID-ENG-DEC-010-011-012-v1.0"
actions:
  # ---- A0: routine (Decision 10 section 02), classified so that a caller can ask and be told no vote is needed -------------------
  - {id: update-organization-presentation-details, tier: A0, scope: CUSTOMER, executor: null, approvers: [], request_matrix: null, gate: "Does not change legal identity, trust state, ownership, permissions or security."}
  - {id: view-dashboard-pay-invoices-manage-profile, tier: A0, scope: CUSTOMER, executor: null, approvers: [], request_matrix: null, gate: "Normal permissions; sensitive changes may need step-up."}
  # ---- Decision 11 section 02: mandatory A2, customer tenant ------------------------------------------------------------------
  - {id: ownership-transfer-or-replacement, tier: A2, scope: CUSTOMER, executor: owner.add, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: a.initiate-organization-ownership-transfer, gate: "Reverify incoming Owner identity and organizational authority; notify affected parties."}
  - {id: removal-of-last-owner-or-control-chain, tier: A2, scope: CUSTOMER, executor: owner.remove, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: a.initiate-organization-ownership-transfer, gate: "Prohibit orphaning the tenant; verify successor and effective ownership record."}
  - {id: privileged-owner-or-admin-recovery, tier: A2, scope: CUSTOMER, executor: lifecycle.recovery_reissue, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Independent identity re-proofing; revoke compromised sessions and authenticators."}
  - {id: privileged-role-grant-or-elevation, tier: A2, scope: CUSTOMER, executor: role.grant_privileged, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: a.request-admin-approver-role-grant, gate: "Evaluate the resulting effective permissions and exclude requester and beneficiary from voting."}
  - {id: weaken-authentication-recovery-or-approval-policy, tier: A2, scope: CUSTOMER, executor: null, no_operation: "No operation exists: the platform permits session limits to be shortened only and forbids removing mandatory controls, so there is no permitted weakening to apply.", approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Only if allowed by non-negotiable platform policy; disallow removal of mandatory controls."}
  - {id: credential-issuer-or-authority-root-change, tier: A2, scope: CUSTOMER, executor: null, no_operation: "Authority roots are established by organization verification and ended by revocation (authority module); there is no tenant operation that replaces one.", approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Check issuer authorization, scope and downstream relying-party effects."}
  - {id: manual-reversal-of-high-assurance-trust-decision, tier: A2, scope: CUSTOMER, executor: trust.adjudication_request, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Independent platform adjudication; tenant votes alone cannot issue verified platform status."}
  - {id: organization-wide-sensitive-export-or-impersonation, tier: A2, scope: CUSTOMER, executor: null, no_operation: "No such capability exists: evidence export is per receipt under evidence.export, and no impersonation power exists for a tenant.", approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Purpose authorization, privacy and residency clearance; strict time limits."}
  - {id: powerful-agent-or-integration-authority, tier: A2, scope: CUSTOMER, executor: lifecycle.agent_activate, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Review agent and integration scopes, key restrictions, human accountability and kill switch."}
  - {id: reinstate-suspended-tenant-access, tier: A2, scope: CUSTOMER, executor: lifecycle.resume, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Re-enabling after an incident follows the full A2 policy; restoration is never immediate."}
  # ---- Decision 11 section 02: mandatory A2, platform and operations -----------------------------------------------------------
  - {id: root-super-admin-or-global-break-glass-grant, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Independent platform Security plus authorized service owner; time-bound, scoped access."}
  - {id: manual-replacement-of-signing-keys-or-trust-anchors, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Key ceremony controls, HSM or KMS evidence, propagation and rollback review."}
  - {id: security-critical-or-trust-policy-rollback, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Signed target release, dependency validation, migration and evidence consistency checks."}
  - {id: manual-restore-of-privileged-identity-authority-or-evidence-records, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Proven backup source, region constraints, integrity and recovery-plan checks."}
  - {id: change-of-production-data-home-region-or-restricted-transfer, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Legal and Privacy clearance in addition to A2; transfers can still be prohibited."}
  - {id: change-of-immutable-evidence-retention-or-audit-safeguards, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Only under approved retention policy; no silent erasure or loss of the evidentiary chain."}
  - {id: unrestricted-bulk-impersonation-or-restricted-data-access, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Prohibit standing access; time-limited just-in-time authorizations and logging."}
  - {id: disable-or-re-enable-platform-security-enforcement-gates, tier: A2, scope: PLATFORM, executor: platform.authorize, approvers: [OWNER], request_matrix: null, gate: "Disabling mandatory safeguards is prohibited; permitted emergency maintenance needs equivalent safeguards, A2 and an incident record."}
  # ---- A1: sensitive (Decision 10 section 02; Decision 12 section 02) -----------------------------------------------------------
  - {id: appoint-independent-reviewer, tier: A1, scope: CUSTOMER, executor: reviewer.activate, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Documented independent authority and no conflict; a reviewer is not an employee, a legal representative, a recovery contact or a paid seat."}
  - {id: issue-or-change-delegated-authority, tier: A1, scope: CUSTOMER, executor: null, no_operation: "The authority module issues and revokes grants under its own attenuation and approval checks; a case would only duplicate them.", approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "A1 or A2 by risk; never self-approved."}
  - {id: invite-nonprivileged-team-member, tier: A1, scope: CUSTOMER, executor: member.invite, approvers: [OWNER, APPROVER, REVIEWER], request_matrix: null, gate: "Classified A0 or A1 in the entitlement registry; a solo organization may choose the independent route."}
  # ---- Decision 12 section 02: never, even with review signatures ---------------------------------------------------------------
  - {id: disable-core-audit, tier: FORBIDDEN, scope: CUSTOMER, executor: null, approvers: [], request_matrix: null, gate: "Basic security and protective governance controls cannot be switched off by any role, tier or signature."}
  - {id: disable-mandatory-multi-factor, tier: FORBIDDEN, scope: CUSTOMER, executor: null, approvers: [], request_matrix: null, gate: "Basic security and protective governance controls cannot be switched off by any role, tier or signature."}
  - {id: unlawful-cross-border-transfer, tier: FORBIDDEN, scope: CUSTOMER, executor: null, approvers: [], request_matrix: null, gate: "Two valid votes cannot authorize a transfer the residency rules or the law prohibit."}
  - {id: illegal-deletion-of-regulated-records, tier: FORBIDDEN, scope: CUSTOMER, executor: null, approvers: [], request_matrix: null, gate: "Two valid votes cannot authorize a deletion the law or a legal hold prohibits."}
  # ---- Decision 11 sections 03 and 08: immediate defensive action, never behind an approval queue ----------------------------------
  - {id: suspend-tenant-access, tier: CONTAINMENT, scope: CUSTOMER, executor: lifecycle.suspend, approvers: [], request_matrix: null, gate: "Executes at once with evidence and prompt review; restoring access is A2."}
  - {id: revoke-compromised-authenticator, tier: CONTAINMENT, scope: CUSTOMER, executor: containment.revoke_authenticator, approvers: [], request_matrix: null, gate: "Executes at once with evidence and prompt review; restoring access is A2."}
