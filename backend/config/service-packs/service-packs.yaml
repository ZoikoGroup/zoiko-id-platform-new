# Service packs (ZID-GAP-001 v2.0 GID-036, section 07.1). Versioned configuration, not tenant data.
# status: PROPOSED (CR-069). Nothing below is a live service: every pack here is DESIGN, which serves local and test
# environments only (the simulated source). A deployed environment has no usable pack, so every credential check is
# refused there until an owner adds a LIVE_PROVEN or PARTNER_ONLY pack with its legal basis, sources, residency,
# retention and review rules, QA gate and a matching policy_hash (docs/qa/global-trust-wave0-matrix.md, Wave 1).
# version: 0.1.0
#
# feature_state: LIVE_PROVEN | PARTNER_ONLY | STAGING | DESIGN | BLOCKED. Anything not listed is UNAVAILABLE.
# disabled_countries: ISO 3166-1 alpha-2 codes switched off whatever packs say.

