# ZID-RCG-003 section 12: the 48 independent conformance and adversarial acceptance cases, and the tests that prove each (CR-083).
# coverage: COVERED (the tests prove the mandatory result), PARTIAL (they prove part of it; the note says what is missing), GAP (nothing proves it).
# Matched by what each test ASSERTS, not by a number in its name: several test names carry T-numbers from other documents.
# tools/scripts/conformance_run.py runs exactly these tests; test_conformance_matrix.py checks every named test exists.
# version: 0.1.0

version: 0.1.0
cases:
  - case: T01
    title: Market not in approved registry
    expected: deny with UNAVAILABLE, no provider charged
    coverage: COVERED
