# Self-run identity verification (CR-095): the biometric engine gate. Versioned configuration, not tenant data.
# status: PROVISIONAL. The engine is OFF. Nothing below is an approved evaluation, a DPIA or a legal basis.
#
# To switch an engine on, a person must fill EVERY field below with real references, and the platform refuses to start the engine otherwise
# (verification/domain/biometric_engine.py). Filling it in does not make the engine good: the evaluation and the DPIA are other people's work.
#   engine.id / engine.version     the adapter you wrote against BiometricEngine, and the exact model version it runs
#   engine.evaluation_id           the id of the independent accuracy and bias evaluation of THIS engine and version
#   engine.evaluated_on            the date of that evaluation (it expires after 365 days)
#   engine.pad_standard            "ISO/IEC 30107-3": a presentation-attack test by an independent lab, not by us
#   engine.licence_checked         true only after somebody read the licence of the engine AND of its pretrained models
#                                  (DeepFace: MIT; Silent-Face-Anti-Spoofing: Apache-2.0; InsightFace pretrained models: NON-COMMERCIAL)
#   engine.dpia_ref                the reference of the approved data protection impact assessment
#   engine.measured.*              the MEASURED rates from that evaluation (0 to 1). Ceilings are provisional engineering values:
#                                  false_accept <= 0.001, false_reject <= 0.05, attack_accept <= 0.05, bona_fide_reject <= 0.10
#   thresholds.*                   the score a face match and a liveness result must reach (0.5 to 1), chosen from the evaluation
#   mode                           DISABLED (the default), LAB_ONLY or APPROVED_FOR_SCOPE (ZID-DTV-WF-01 screen O1). LAB_ONLY is for evaluation
#                                  only: it is never routed to a live decision, even when everything else is filled in. APPROVED_FOR_SCOPE needs
#                                  every field below AND scope.countries, and the engine then runs only for sessions in those countries.
#                                  `enabled: true` with no mode is refused: whoever switches an engine on must say how far it may go.
#   engine.components              the register ids (engine-register.yaml) of every library and pretrained model this engine is built from.
#                                  APPROVED_FOR_SCOPE is refused unless each one is in the register with commercial use confirmed, its model
#                                  licences read, and the date a person verified them. The shipped register verifies nothing.
#   scope.countries                ISO 3166-1 alpha-2 codes a person approved this engine for (an evaluation covers a population, not the world)
version: 0.1.0
status: PROVISIONAL
enabled: false
mode: DISABLED
scope:
  countries: []
engine:
  id: ""
  version: ""
  components: []
  evaluation_id: ""
  evaluated_on: ""
  pad_standard: ""
  licence_checked: false
  dpia_ref: ""
  measured:
    false_accept: null
    false_reject: null
    attack_accept: null
    bona_fide_reject: null
thresholds:
  face_match_min: null
  liveness_min: null
