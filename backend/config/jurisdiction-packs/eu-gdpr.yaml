pack_id: eu-gdpr
framework: "EU GDPR"
position: "Binding EU privacy baseline"
architecture_consequences: [purpose_limitation, minimisation, storage_limitation, lawful_basis, rights, privacy_by_design, dpia, international_transfer_controls]
