rights_response_deadlines: COUNSEL
international_transfers:
  supported_mechanisms: [adequacy, eu_standard_contractual_clauses]
  note: "Contracts are necessary but do not replace technical residency, access and minimisation enforcement (§24)"
retention_overrides: COUNSEL          # engineering defaults in ZID-PRIV-001 §31 apply until counsel sets values
backup_erasure_window: COUNSEL        # ADR-0006
