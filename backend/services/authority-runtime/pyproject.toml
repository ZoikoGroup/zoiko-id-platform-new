[project]
name = "authority-runtime"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "zid-context",
  "zid-db",
  "zid-errors",
  "zid-outbox",
  "zid-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_authority_runtime"]
