[project]
name = "security-evidence"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
  "uvicorn[standard]>=0.32",
  "zid-app",
  "zid-context",
  "zid-db",
  "zid-errors",
  "zid-outbox",
  "zid-telemetry",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_security_evidence"]
