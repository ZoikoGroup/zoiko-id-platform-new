[project]
name = "zoiko-id-platform"
version = "0.1.0"
description = "Zoiko iD backend — modular monolith (DEC-D6)"
requires-python = ">=3.13"
dependencies = [
  "zid-app",
  "zid-context",
  "zid-db",
  "zid-errors",
  "zid-evidence",
  "zid-idempotency",
  "zid-outbox",
  "zid-telemetry",
  "uvicorn[standard]>=0.32",
  "alembic>=1.14",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "cedarpy>=4.1",
  "httpx>=0.28",
  "zid-crypto",
  "webauthn>=3.0",
  "cbor2>=6.1",  # imported directly (mdoc, barcode, device attestation); was only present through webauthn
  "signxml>=4.0",
  "defusedxml>=0.7",
  "scim2-models>=0.3",
  "google-cloud-kms>=3.2",  # gcp-kms key provider (deployed cells on GCP); imported lazily
  "pyasn1>=0.6",  # RFC 3161 timestamp token validation (evidence/infrastructure/tsa_token.py)
  "pyasn1-modules>=0.4",
  "pyld==3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_platform"]

[tool.uv.sources]
zid-crypto = { workspace = true }
