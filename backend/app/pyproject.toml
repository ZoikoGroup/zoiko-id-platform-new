[project]
name = "zoiko-id-platform"
version = "0.1.0"
description = "Zoiko iD backend — modular monolith (DEC-D6)"
requires-python = ">=3.13"
dependencies = [
  "zid-app",
  "zid-context",
  "zid-db",
  "zid-errors",
  "zid-outbox",
  "zid-telemetry",
  "uvicorn[standard]>=0.32",
  "alembic>=1.14",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "cedarpy>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zid_platform"]
