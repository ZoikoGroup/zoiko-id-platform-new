# Frontend CI: the two Next.js consoles and their packages. Lint, types, tests, a production build of both apps, a check that
# the generated API client matches the published contracts, and a dependency audit. `frontend-checks` is the single gate.
#
# Every pull request runs it (no `paths` filter) so the gate is always reported. Actions are pinned by commit SHA.
name: frontend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"  # the version the production image is built with (frontend/Dockerfile)
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm run test

      # The API client's types are generated from contracts/openapi. A contract change without regenerated types fails here.
      - name: Generated API client matches the contracts
        run: |
          set -euo pipefail
          npm run codegen
          git diff --exit-code -- packages/api-client/src/generated

      - name: Build both apps
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # What ships (no dev tooling) must have no high or critical advisory. Fix by upgrading the package, never by ignoring.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  frontend-checks:
    name: frontend-checks
    if: always()
    needs: [verify, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every frontend job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "a frontend job did not pass" >&2
            exit 1
          fi
