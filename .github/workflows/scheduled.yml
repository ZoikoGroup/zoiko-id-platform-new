# Nightly checks that do not depend on a change: new advisories against the dependencies we already ship. A hit opens an
# issue (one per day at most) so it is seen even when nobody is pushing. Not triggered by pull requests; read-only token
# except for the issue the failing job opens. Actions are pinned by commit SHA.
name: scheduled

on:
  schedule:
    - cron: "17 3 * * *"  # 03:17 UTC, off the hour on purpose
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - name: Audit the locked dependency set
        run: |
          set -euo pipefail
          uv export --frozen --all-packages --no-emit-workspace --no-hashes --no-header > "$RUNNER_TEMP/requirements.txt"
          uv tool run pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off
      - name: Open an issue for the new advisory
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --label security --title "Python dependency advisory ($(date -u +%F))"
          --body "The nightly audit of backend/uv.lock found a known vulnerability. Update the lock (uv lock --upgrade-package NAME) and merge. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  node-advisories:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Open an issue for the new advisory
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --label security --title "Node dependency advisory ($(date -u +%F))"
          --body "The nightly audit of frontend/package-lock.json found a high or critical vulnerability. Upgrade the package and merge. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
