# Backend CI (DEC-G4 pipeline): static checks, the full test suite (unit and PostgreSQL component) in parallel jobs, dependency
# and source security scans, and one `checks` gate that the branch ruleset requires. The JUnit reports are kept as build
# artifacts: they are the retained evidence that closes gates in contracts/baseline/gates.yaml.
#
# No `paths` filter on pull_request: a required check that never starts leaves a pull request waiting forever, so every
# pull request runs everything and the gate below is always reported.
#
# Actions are pinned by commit SHA (DEC-G4); the tag is kept in a trailing comment for updates.
name: backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.0"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false  # tests run repository code: it must not find a token in .git/config
          lfs: false  # specs are not in Git; nothing to fetch

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Repository structure checks
        working-directory: .
        run: python3 tools/scripts/check_repo.py

      - name: Contract compatibility against the base branch
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_REF"
          mkdir -p "$RUNNER_TEMP/base"
          git archive FETCH_HEAD contracts | tar -x -C "$RUNNER_TEMP/base"
          python3 tools/scripts/contract_compat.py "$RUNNER_TEMP/base/contracts" contracts

      - name: The lockfile matches pyproject (nothing resolved at install time)
        run: uv lock --check

      - name: Install (locked)
        run: uv sync --frozen --all-packages

      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Types
        run: uv run --frozen mypy app/src/zid_platform

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          lfs: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --frozen --all-packages
      # No services here: unit, property and contract tests and the libraries' own tests. One line per test (-v) so a
      # slow or stuck test is visible in the live log, and the step has its own timeout so a hang fails fast.
      - name: Tests (unit, property, contract, libraries)
        timeout-minutes: 15
        run: >-
          uv run --frozen pytest -v -p no:logging --durations=15
          app/tests/unit app/tests/property app/tests/contract libs
          --junitxml=../reports/backend-unit-junit.xml -o junit_family=xunit2
      - name: Keep the test report as evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-unit-junit-${{ github.sha }}
          path: reports/backend-unit-junit.xml
          retention-days: 400

  component:
    name: component
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Disposable CI database; the component suite creates and drops its own database inside it (AT-04 mandate concurrency).
      ZID_TEST_PG_URL: postgresql+asyncpg://postgres:ci-only@localhost:5432/postgres
      ZID_TEST_SPICEDB_URL: http://localhost:58443
      ZID_TEST_KAFKA: localhost:59092
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          lfs: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Start SpiceDB (a service container cannot pass the `serve` command)
        run: >-
          docker run -d --rm --name spicedb -p 58443:8443 authzed/spicedb:v1.39.1 serve
          --grpc-preshared-key test-key --http-enabled --datastore-engine memory --telemetry-endpoint=""

      - name: Start Kafka (KRaft, single node)
        run: >-
          docker run -d --rm --name kafka -p 59092:9092 -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller
          -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:59092
          -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true apache/kafka:3.8.0

      - name: Install (locked)
        run: uv sync --frozen --all-packages

      - name: Tests (PostgreSQL component)
        timeout-minutes: 25
        run: >-
          uv run --frozen pytest -v -p no:logging --durations=15
          app/tests/component
          --junitxml=../reports/backend-component-junit.xml -o junit_family=xunit2

      - name: Keep the test report as evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-component-junit-${{ github.sha }}
          path: reports/backend-component-junit.xml
          retention-days: 400

  # Dependencies as locked (uv.lock), checked against the Python advisory database. A finding fails the job: fix it by
  # updating the lock (`uv lock --upgrade-package <name>`), not by ignoring it.
  python-audit:
    name: python-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Audit the locked dependency set
        run: |
          set -euo pipefail
          uv export --frozen --all-packages --no-emit-workspace --no-hashes --no-header > "$RUNNER_TEMP/requirements.txt"
          uv tool run pip-audit==2.10.1 -r "$RUNNER_TEMP/requirements.txt" --no-deps --disable-pip --progress-spinner off

  # Static analysis of our own source for medium-or-worse issues with high confidence (tests excluded: they plant weak hashes
  # and keys on purpose). Runs on Python 3.13 because the code uses 3.13 syntax and the analyser reads it with its own interpreter.
  sast:
    name: sast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Bandit
        run: uv tool run --python 3.13 bandit==1.9.4 -r app/src libs -ll -iii -x '*/tests/*' -q

  # The one check the branch ruleset requires for the backend. Always reported (even when a job above failed or was
  # skipped), and green only when every job above is green.
  checks:
    name: checks
    if: always()
    needs: [static, unit, component, python-audit, sast]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every backend job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'; then
            echo "a backend job did not pass" >&2
            exit 1
          fi
