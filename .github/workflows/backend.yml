# Backend CI (DEC-G4 pipeline, first slice): repo checks, lint, types, and the full test suite
# including the PostgreSQL component tests (AT-04 mandate concurrency). The JUnit report is kept
# as a build artifact: it is the retained evidence that closes gates in contracts/baseline/gates.yaml.
#
# Actions are pinned by commit SHA (DEC-G4); the tag is kept in a trailing comment for updates.
name: backend

on:
  push:
    branches: [main]
  pull_request:
    paths: ["backend/**", "contracts/**", "docs/**", "tools/**", "tests/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Disposable CI database; the component suite creates and drops its own database inside it.
      ZID_TEST_PG_URL: postgresql+asyncpg://postgres:ci-only@localhost:5432/postgres
      ZID_TEST_SPICEDB_URL: http://localhost:58443
      ZID_TEST_KAFKA: localhost:59092
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false  # specs are not in Git; nothing to fetch

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Start SpiceDB (a service container cannot pass the `serve` command)
        run: >-
          docker run -d --rm --name spicedb -p 58443:8443 authzed/spicedb:v1.39.1 serve
          --grpc-preshared-key test-key --http-enabled --datastore-engine memory --telemetry-endpoint=""

      - name: Start Kafka (KRaft, single node)
        run: >-
          docker run -d --rm --name kafka -p 59092:9092 -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller
          -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:59092
          -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=true apache/kafka:3.8.0

      - name: Repository structure checks
        working-directory: .
        run: python3 tools/scripts/check_repo.py

      - name: Install (locked)
        run: uv sync --frozen --all-packages

      - name: Lint and format
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: Types
        run: uv run --frozen mypy app/src/zid_platform

      # One line per test (-v) so a slow or stuck test is visible in the live log; the step has
      # its own timeout so a hang fails fast instead of holding the runner until the job limit.
      - name: Tests (unit, property, contract, PostgreSQL component)
        timeout-minutes: 15
        run: >-
          uv run --frozen pytest -v -p no:logging --durations=15
          --junitxml=../reports/backend-junit.xml -o junit_family=xunit2

      - name: Keep the test report as evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-junit-${{ github.sha }}
          path: reports/backend-junit.xml
          retention-days: 400
