# Reusable, hardened builder (SLSA Build L3 target, DEC-G4 §3): the build runs in this called workflow, so the
# signing identity and the provenance builder id are THIS file, not the caller's. A caller cannot alter the build
# steps, and the provenance is generated by the platform OIDC identity of the job, not by build code.
# Callers: release.yml. Never invoked from pull_request or pull_request_target.
name: build-image

on:
  workflow_call:
    outputs:
      digest:
        description: "sha256 digest of the pushed image"
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/zoikogroup/zoiko-id-platform
  TRIVY_IMAGE: aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7

jobs:
  build:
    if: github.repository == 'ZoikoGroup/Zoiko-ID-Platform'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry with the job token
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          target: runtime
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Scan the image and write the CycloneDX SBOM bound to the digest
        run: |
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm -v "$PWD:/out" "$TRIVY_IMAGE" image --format cyclonedx --output /out/sbom.cdx.json "$ref"
          docker run --rm -v "$PWD:/out" "$TRIVY_IMAGE" image --format json --severity CRITICAL,HIGH --output /out/findings.json "$ref"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true
      - name: Sign by digest (keyless, workload-bound OIDC identity)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            sbom.cdx.json
            findings.json
          retention-days: 400
