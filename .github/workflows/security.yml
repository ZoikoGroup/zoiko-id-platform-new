# Security gates on every change (DEC-G4 §1-2). Runs on `pull_request` ONLY, never `pull_request_target`, with a
# read-only token and no secrets, so a fork or untrusted PR can neither read a secret nor sign anything.
# Actions are pinned by commit SHA.
name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Scan tracked files for credentials
        run: python3 tools/scripts/secret_scan.py
      # A hit means the secret is compromised: open a rotation incident (revoke + rotate + purge history),
      # not just a deletion commit. Only same-repo runs have a token that may write issues.
      - name: Open a secret-rotation incident
        if: failure() && github.event.pull_request.head.repo.fork != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh issue create --label "security,secret-compromised" --title "Rotate: credential committed in ${{ github.sha }}"
          --body "secret-scan found a credential-shaped string. Treat it as COMPROMISED: revoke it at the provider, issue a new one from the secrets broker, then remove it from history. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  devsecops-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.0"
      - name: Static DevSecOps control tests (policies, charts, workflows, Dockerfile, release gate)
        working-directory: backend
        run: uv run --frozen --all-packages pytest app/tests/unit/test_devsecops_controls.py -q -p no:logging
