# Dependency updates as reviewed pull requests. Everything is pinned (actions by SHA, Python and Node by lockfile, images by
# digest), so nothing moves unless one of these opens a PR and CI passes. Security updates open immediately; routine updates
# are grouped weekly so they arrive as one reviewable change rather than a stream.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      node-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(image)"

  - package-ecosystem: terraform
    directory: /deploy/tofu
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(iac)"
