# Proposed events: needed by engineering but not yet in a canonical spec's event list.
# status: PROPOSED (each entry names its change request; moves to the generated catalogue once the spec owner accepts)
# version: 0.1.0
# Same shape as event-catalogue.yaml. Emitting a type that is in neither file fails CI.

events:
  credential.eligibility.decided:
    cloudevents_type: com.zoiko.id.credential.eligibility.decided.v1
    meaning: "An eligibility or engagement decision was made for a subject; carries the decision id, outcome and policy ref, never a credential value."
    source: ZID-GAP-001 v2.0; CR-069
    lane: domain
    source_status: "proposed"
  credential.status_changed:
    cloudevents_type: com.zoiko.id.credential.status_changed.v1
    meaning: "A source reported a status change for a monitored claim check and a superseding check was recorded; ids and status only."
    source: ZID-GAP-001 v2.0; CR-069
    lane: domain
    source_status: "proposed"
  verification.case.completed:
    cloudevents_type: com.zoiko.id.verification.case.completed.v1
    meaning: "Every check of a verification case has its own outcome; ids, state and per-check outcomes only."
    source: ZID-INT-002 sections 04 and 13; CR-071
    lane: domain
    source_status: "proposed"
  eligibility.recomputed:
    cloudevents_type: com.zoiko.id.eligibility.recomputed.v1
    meaning: "A person's eligibility or engagement decision for the same policy changed from the previous one; ids, the two outcomes, reason codes and the policy reference only."
    source: ZID-INT-002 section 13; CR-071
    lane: domain
    source_status: "proposed"
  evidence.retention_action:
    cloudevents_type: com.zoiko.id.evidence.retention_action.v1
    meaning: "Uploaded evidence was deleted or expired and its bytes erased; the reference, the action and the time only. It never claims a provider or backup deleted anything."
    source: ZID-INT-002 section 13; CR-071
    lane: domain
    source_status: "proposed"
  property.authority_changed:
    cloudevents_type: com.zoiko.id.property.authority_changed.v1
    meaning: "The authority answer for a property and host changed from the previous check; references, the two overall outcomes and each dimension that moved. No document or text from one."
    source: ZID-INT-002 section 13; CR-071
    lane: domain
    source_status: "proposed"
  provider.entitlement_revoked:
    cloudevents_type: com.zoiko.id.provider.entitlement_revoked.v1
    meaning: "A provider entitlement was revoked and its path is closed; ids, the provider, the service and the previous status only. Revoked is final."
    source: ZID-INT-002 sections 08 and 13; CR-071
    lane: domain
    source_status: "proposed"
  privacy.review.decided:
    cloudevents_type: com.zoiko.id.privacy.review.decided.v1
    meaning: "An independent person decided an appeal or human review of an automated decision; the review id and the outcome only. The rationale stays on the record."
    source: ZID-PRI-004 sections 10, 11 and 22 (AT-030, AT-031); CR-072
    lane: domain
    source_status: "proposed"
  privacy.dpia.reassessment_due:
    cloudevents_type: com.zoiko.id.privacy.dpia.reassessment_due.v1
    meaning: "An approved DPIA package comes within its reassessment window or has lapsed; package id, market, product, version and the approval end only. A biometric method resting on it stops when it lapses (ZID-DTV-WF-04 BIO-20)."
    source: ZID-DTV-WF-04 BIO-20; CR-110
    lane: domain
    source_status: "proposed"
  privacy.biometric.deletion_confirmed:
    cloudevents_type: com.zoiko.id.privacy.biometric.deletion_confirmed.v1
    meaning: "A biometric asset class of an erasure job is purged: its stores, its providers and the backups all acknowledged. Job id, class and the receipts commitment only, never content (ZID-DTV-WF-04 section 19)."
    source: ZID-DTV-WF-04 B05; CR-110
    lane: evidence
    source_status: "proposed"
  verification.biometric.policy_blocked:
    cloudevents_type: com.zoiko.id.verification.biometric.policy_blocked.v1
    meaning: "A biometric method was not used because a gate refused it (method state, DPIA, overlay, breach pause, retention or evaluation). Route, country, purpose, the refused methods with their codes and the policy hash only; never a person, an image or a score (ZID-DTV-WF-04 section 19)."
    source: ZID-DTV-WF-04 section 19; CR-110
    lane: domain
    source_status: "proposed"
  verification.biometric.region_blocked:
    cloudevents_type: com.zoiko.id.verification.biometric.region_blocked.v1
    meaning: "A biometric route failed closed because the provider would process the country's data outside its approved regions (no lawful transfer, or no known region). Country, provider, the provider's region, the reason codes and the overlay hash only; never a person, a session or an image (ZID-DTV-WF-04 QA-029)."
    source: ZID-DTV-WF-04 QA-029; CR-113
    lane: domain
    source_status: "proposed"
  privacy.erasure.deletion_requested:
    cloudevents_type: com.zoiko.id.privacy.erasure.deletion_requested.v1
    meaning: "A provider's deletion for an erasure job is overdue or failed and is asked for again; job id, task id, provider, asset classes, the attempt number and the previous failure code only (ZID-DTV-WF-04 QA-023)."
    source: ZID-DTV-WF-04 QA-023; CR-113
    lane: domain
    source_status: "proposed"
  privacy.erasure.deletion_failed:
    cloudevents_type: com.zoiko.id.privacy.erasure.deletion_failed.v1
    meaning: "An erasure task could not be completed: a provider's deletion ran out of attempts, or a first-party store has no way to delete. The task stays FAILED, never completed; job id, task id, target, asset classes, the failure code and the attempts only (ZID-DTV-WF-04 QA-023)."
    source: ZID-DTV-WF-04 QA-023; CR-113
    lane: priority
    source_status: "proposed"
  privacy.decision.changed:
    cloudevents_type: com.zoiko.id.privacy.decision.changed.v1
    meaning: "A contested decision was overturned or corrected after an independent review and a checker; the review id, the decision reference, the outcome and the correction reference only. Whoever relied on the decision must re-read it (ZID-DTV-WF-04 section 19 decision.changed)."
    source: ZID-DTV-WF-04 B08; CR-109
    lane: priority
    source_status: "proposed"
  credential.claim.recheck.due:
    cloudevents_type: com.zoiko.id.credential.claim.recheck.due.v1
    meaning: "A monitored claim check is due to be re-asked of its source (expiry or freshness); ids and reason only."
    source: ZID-GAP-001 v2.0; CR-069
    lane: domain
    source_status: "proposed"
  credential.claim.appealed:
    cloudevents_type: com.zoiko.id.credential.claim.appealed.v1
    meaning: "A person appealed or asked for correction of a claim check; ids only."
    source: ZID-GAP-001 v2.0; CR-069
    lane: domain
    source_status: "proposed"
  credential.claim.checked:
    cloudevents_type: com.zoiko.id.credential.claim.checked.v1
    meaning: "A credential claim was checked against a source; carries the check id, claim type and decision only, never a claimed value."
