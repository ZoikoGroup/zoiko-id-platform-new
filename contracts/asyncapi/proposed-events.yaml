  verification.biometric_method.state_changed:
    cloudevents_type: com.zoiko.id.verification.biometric_method.state_changed.v1
    meaning: "A biometric method scope moved state (an approved step up, a pause, a step down or retirement); the scope id, version, state, scope fields and references only, never media or reason text (ZID-DTV-WF-04 section 06)."
    source: ZID-DTV-WF-04 BIO-03; CR-107, CR-108
    lane: priority
    source_status: "proposed"
  verification.check_method.state_changed:
    cloudevents_type: com.zoiko.id.verification.check_method.state_changed.v1
    meaning: "A WF-05 check method scope (email, phone, carrier, address, postal, device) moved state (an approved step up, a pause, a step down or retirement); the scope id, version, state, scope fields and references only, never a contact, an address or reason text (ZID-DTV-WF-05 §04, §27)."
    source: ZID-DTV-WF-05 §04, §27; CR-112
    lane: priority
    source_status: "proposed"
  credential.issuer_status_changed:
    cloudevents_type: com.zoiko.id.credential.issuer_status_changed.v1
    meaning: "A dated statement about an issuer, its names or accreditations was recorded; issuer id, sequence, statement kind and source hash only (09.2 credential.issuer_status_changed)."
    source: ZID-RCG-003 RCG-G04; CR-075
    lane: domain
    source_status: "proposed"
  evidence.bundle.exported:
    cloudevents_type: com.zoiko.id.evidence.bundle.exported.v1
    meaning: "A regulatory evidence bundle was exported with a stated purpose and legal basis; bundle id, digest, purpose and legal basis reference only (ZID-RCG-003 09.2 audit.exported)."
    source: ZID-RCG-003 09.2; CR-085
    lane: evidence
    source_status: "proposed"
  agent.run.policy_denied:
    cloudevents_type: com.zoiko.id.agent.run.policy_denied.v1
    meaning: "An access readiness run was refused at its preflight; run id, agent id, denial codes and policy hash only (ZID-AG-WF-001 section 10)."
    source: ZID-AG-WF-001; CR-091
    lane: domain
    source_status: "proposed"
  agent.run.completed:
    cloudevents_type: com.zoiko.id.agent.run.completed.v1
    meaning: "An access readiness run reached a terminal state (completed, needs review, failed or canceled); counts and the result digest only."
    source: ZID-AG-WF-001; CR-091
    lane: domain
    source_status: "proposed"
  agent.review.proposal_created:
    cloudevents_type: com.zoiko.id.agent.review.proposal_created.v1
    meaning: "The access readiness agent appended a review proposal for a person; proposal id, rule and finding code only. No right changed."
    source: ZID-AG-WF-001; CR-091
    lane: domain
    source_status: "proposed"
  credential.proof.review_required:
    cloudevents_type: com.zoiko.id.credential.proof.review_required.v1
    meaning: "A current proof was flagged for review because the issuer or accreditation body behind it lost its status; check id, claim type, issuer id, loss reason codes and the statement id only."
    source: ZID-RCG-003 section 12 T42; CR-092
    lane: domain
    source_status: "proposed"
  verification.session.policy_reevaluated:
    cloudevents_type: com.zoiko.id.verification.session.policy_reevaluated.v1
    meaning: "A verification session that had not finished was re-evaluated because the policy pack governing its region changed or its provider was suspended; session id, country, capability, the pack it started under, the pack that governs now and the result only."
    source: ZID-RCG-003 section 12 T40; CR-092
    lane: domain
    source_status: "proposed"
  credential.fairness.path_held:
    cloudevents_type: com.zoiko.id.credential.fairness.path_held.v1
    meaning: "The disparity check held the automated 'different person' answers of a name cohort for a person; cohort, reason code and aggregate counts and rates only, never a name or a person."
    source: ZID-RCG-003 section 12 T44; CR-092
    lane: domain
    source_status: "proposed"
  evidence.trust_package.staged:
    cloudevents_type: com.zoiko.id.evidence.trust_package.staged.v1
    meaning: "An imported country signing CA list was staged with its source and anchors; nothing is trusted yet (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.validated:
    cloudevents_type: com.zoiko.id.evidence.trust_package.validated.v1
    meaning: "A staged list verified against its anchors and is a candidate for approval (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.rejected:
    cloudevents_type: com.zoiko.id.evidence.trust_package.rejected.v1
    meaning: "A staged list was rejected (it did not verify, or a person rejected it with a reason) (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.approved:
    cloudevents_type: com.zoiko.id.evidence.trust_package.approved.v1
    meaning: "A validated list was approved by a person other than the one who staged it (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.activated:
    cloudevents_type: com.zoiko.id.evidence.trust_package.activated.v1
    meaning: "An approved list became the active trust set (also written when a rollback restores one) (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.superseded:
    cloudevents_type: com.zoiko.id.evidence.trust_package.superseded.v1
    meaning: "The previously active list stopped being active because another was activated (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.rolled_back:
    cloudevents_type: com.zoiko.id.evidence.trust_package.rolled_back.v1
    meaning: "The active list was rolled back with a reason (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  evidence.trust_package.retired:
    cloudevents_type: com.zoiko.id.evidence.trust_package.retired.v1
    meaning: "The active list was retired; the store now trusts nothing until another is activated (package id, kind, sequence, state, the actor and the SHA-256 of the list only; never the list, anchors or certificates)."
    source: ZID-DTV-WF-01 section 13; CR-107
    lane: domain
    source_status: "proposed"
  verification.proofing.completed:
    cloudevents_type: com.zoiko.id.verification.proofing.completed.v1
    meaning: "A verification session reached a decision the platform stands behind: the WF01 assertion facts that hold, the pinned profile and its version, the region and the expiry; no evidence and no value of any claim."
    source: ZID-DTV-WF-01 section 14; CR-107
    lane: domain
    source_status: "proposed"
  verification.proofing.indeterminate:
    cloudevents_type: com.zoiko.id.verification.proofing.indeterminate.v1
    meaning: "A verification session could not be judged and is waiting or needs another route: the missing method, the failure class, whether a retry can help and the next action; never a pass."
    source: ZID-DTV-WF-01 section 14; CR-107
    lane: domain
    source_status: "proposed"
