# Proposed events: needed by engineering but not yet in a canonical spec's event list.
# status: PROPOSED (each entry names its change request; moves to the generated catalogue once the spec owner accepts)
# version: 0.1.0
# Same shape as event-catalogue.yaml. Emitting a type that is in neither file fails CI.

events:
  relationship.edge.changed:
    cloudevents_type: com.zoiko.id.relationship.edge.changed.v1
    meaning: "An authoritative relationship fact was recorded or changed; carries the tenant relation_revision (projector input, DEC-C4)."
    source: ZID-AUTHZ-001 §7.1 (revision-consistent projection); CR-008
    lane: domain
    source_status: "proposed"
  security.state.changed:
    cloudevents_type: com.zoiko.id.security.state.changed.v1
    meaning: "Canonical security state of a subject changed; carries previous/current state, revision, cause signal and risk floor (internal propagation envelope)."
    source: ZID-SIGNALS-001 §27; CR-009
    lane: priority
    source_status: "proposed"
  provisioning.resource.changed:
    cloudevents_type: com.zoiko.id.provisioning.resource.changed.v1
    meaning: "A SCIM User or Group was created, replaced, patched or deleted by a provisioning source (ids, operation and version only)."
    source: ZID-AUTH-001 §11; CR-009
    lane: domain
    source_status: "proposed"
  operator_access.requested:
    cloudevents_type: com.zoiko.id.operator_access.requested.v1
    meaning: "An operator requested just-in-time access (case, scope, capability, duration as commitments)."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.approval.recorded:
    cloudevents_type: com.zoiko.id.operator_access.approval.recorded.v1
    meaning: "An independent approver approved a JIT request (one per approver)."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.approved:
    cloudevents_type: com.zoiko.id.operator_access.approved.v1
    meaning: "A JIT request reached its required approvals (two-person for R3)."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.denied:
    cloudevents_type: com.zoiko.id.operator_access.denied.v1
    meaning: "A JIT request was denied by an approver."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.cancelled:
    cloudevents_type: com.zoiko.id.operator_access.cancelled.v1
    meaning: "The requester cancelled a JIT request."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.activated:
    cloudevents_type: com.zoiko.id.operator_access.activated.v1
    meaning: "An approved JIT grant became active; its expiry clock started."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.revoked:
    cloudevents_type: com.zoiko.id.operator_access.revoked.v1
    meaning: "An active JIT grant was revoked before expiry."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: priority
    source_status: "proposed"
  operator_access.expired:
    cloudevents_type: com.zoiko.id.operator_access.expired.v1
    meaning: "A JIT grant or request reached its end and was marked expired."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.direct_action:
    cloudevents_type: com.zoiko.id.operator_access.direct_action.v1
    meaning: "An operator used a capability in direct mode (no access request, no second approver); Security can alert on it. CR-035."
    source: DEC-F4; CR-035
    lane: priority
    source_status: "proposed"
  operator_access.break_glass.activated:
    cloudevents_type: com.zoiko.id.operator_access.break_glass.activated.v1
    meaning: "Emergency break-glass access activated; Security alerted; post-review pending."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: priority
    source_status: "proposed"
  operator_access.review.completed:
    cloudevents_type: com.zoiko.id.operator_access.review.completed.v1
    meaning: "The independent post-review of a break-glass grant was completed."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.lockbox.requested:
    cloudevents_type: com.zoiko.id.operator_access.lockbox.requested.v1
    meaning: "A customer lockbox approval was requested for operator access to tenant data."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.lockbox.approved:
    cloudevents_type: com.zoiko.id.operator_access.lockbox.approved.v1
    meaning: "The customer approved the lockbox request (scoped, time-bound)."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.lockbox.denied:
    cloudevents_type: com.zoiko.id.operator_access.lockbox.denied.v1
    meaning: "The customer denied the lockbox request."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.lockbox.revoked:
    cloudevents_type: com.zoiko.id.operator_access.lockbox.revoked.v1
    meaning: "The customer withdrew a lockbox approval; operator access stops at once."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: priority
    source_status: "proposed"
  operator_access.policy.changed:
    cloudevents_type: com.zoiko.id.operator_access.policy.changed.v1
    meaning: "The tenant changed its operator-access policy (lockbox, operator jurisdictions)."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  operator_access.operator.registered:
    cloudevents_type: com.zoiko.id.operator_access.operator.registered.v1
    meaning: "A workforce operator profile was provisioned or changed."
    source: ZID-SEC-001 §11-13; DEC-F4; CR-012
    lane: domain
    source_status: "proposed"
  machine.environment.released:
    cloudevents_type: com.zoiko.id.machine.environment.released.v1
    meaning: "A quarantined workload environment was released after review (security_revision stays bumped)."
    source: DEC-F7 §4; CRYPTO-MI-001 §29; CR-014
    lane: domain
    source_status: "proposed"
  privacy.processing.refused:
    cloudevents_type: com.zoiko.id.privacy.processing.refused.v1
    meaning: "A processing boundary refused processing the tenant's privacy registry does not permit (purpose, category, consent, restriction or transfer)."
    source: ZID-PRIV-001 §3, §29; CR-013
    lane: domain
    source_status: "proposed"
  privacy.processing.unregistered:
    cloudevents_type: com.zoiko.id.privacy.processing.unregistered.v1
    meaning: "Audit-mode record of processing that the registry would refuse once the tenant's processing activities are registered."
    source: ZID-PRIV-001 §3; CR-013
    lane: domain
    source_status: "proposed"
  privacy.processor.status_changed:
    cloudevents_type: com.zoiko.id.privacy.processor.status_changed.v1
    meaning: "A processor/subprocessor/recipient registry entry was approved, suspended or retired (PRIV-001 §23)."
    source: ZID-PRIV-001 §23; CR-013
    lane: domain
    source_status: "proposed"
  tenant.lifecycle.changed:
    cloudevents_type: com.zoiko.id.tenant.lifecycle.changed.v1
    meaning: "Any tenant lifecycle transition (from/to status, move, reason code, gate counts); OVERLAY §2 history."
    source: ZID-OVERLAY-001 §2-4; CR-015
    lane: domain
    source_status: "proposed"
  tenant.member.changed:
    cloudevents_type: com.zoiko.id.tenant.member.changed.v1
    meaning: "A MEMBER/ADMIN role was invited, accepted or revoked (ids and states only)."
    source: ZID-OVERLAY-001 §2-4; CR-015
    lane: domain
    source_status: "proposed"
  tenant.suspended:
    cloudevents_type: com.zoiko.id.tenant.suspended.v1
    meaning: "A tenant was suspended: production trust/enforcement disabled (OVERLAY §2)."
    source: ZID-OVERLAY-001 §2-4; CR-015
    lane: priority
    source_status: "proposed"
  tenant.resumed:
    cloudevents_type: com.zoiko.id.tenant.resumed.v1
    meaning: "A suspended tenant resumed after governed recovery (second administrator)."
    source: ZID-OVERLAY-001 §2-4; CR-015
    lane: domain
    source_status: "proposed"
  tenant.closed:
    cloudevents_type: com.zoiko.id.tenant.closed.v1
    meaning: "A tenant reached CLOSED: no runtime trust, retained evidence only."
    source: ZID-OVERLAY-001 §2-4; CR-015
    lane: domain
    source_status: "proposed"
  tenant.domain.changed:
    cloudevents_type: com.zoiko.id.tenant.domain.changed.v1
    meaning: "A domain challenge was started, expired or revoked (ids, method, status; the domain as a commitment)."
    source: ZID-OVERLAY-001 §5; CR-015
    lane: domain
    source_status: "proposed"
  tenant.domain.stale:
    cloudevents_type: com.zoiko.id.tenant.domain.stale.v1
    meaning: "A verified domain could no longer be re-proven: verification STALE, tenant security revision bumped."
    source: ZID-OVERLAY-001 §5, §31; CR-015
    lane: priority
    source_status: "proposed"
  integration.application.changed:
    cloudevents_type: com.zoiko.id.integration.application.changed.v1
    meaning: "An application/PEP registration was created or changed status (OVERLAY §14)."
    source: ZID-OVERLAY-001 §14; CR-015
    lane: domain
    source_status: "proposed"
  integration.connector.changed:
    cloudevents_type: com.zoiko.id.integration.connector.changed.v1
    meaning: "A non-identity connector (signals, webhook, directory) was registered or released."
    source: ZID-OVERLAY-001 §15; CR-015
    lane: domain
    source_status: "proposed"
  integration.credential.rotated:
    cloudevents_type: com.zoiko.id.integration.credential.rotated.v1
    meaning: "A connector credential version was set; the previous one overlaps for a bounded window (fingerprint only)."
    source: ZID-OVERLAY-001 §16; CR-015
    lane: domain
    source_status: "proposed"
  integration.credential.expiring:
    cloudevents_type: com.zoiko.id.integration.credential.expiring.v1
    meaning: "A connector credential crossed a 30/14/7/1-day expiry threshold."
    source: ZID-OVERLAY-001 §16, §29; CR-015
    lane: domain
    source_status: "proposed"
  integration.mapping_release.changed:
    cloudevents_type: com.zoiko.id.integration.mapping_release.changed.v1
    meaning: "A mapping release was created or simulated (DRAFT/REVIEW; content hash, version)."
    source: ZID-OVERLAY-001 §11; CR-015
    lane: domain
    source_status: "proposed"
  onboarding.plan.changed:
    cloudevents_type: com.zoiko.id.onboarding.plan.changed.v1
    meaning: "An onboarding plan version was created or approved (version, status, target mode)."
    source: ZID-OVERLAY-001 §17-19; CR-015
    lane: domain
    source_status: "proposed"
  onboarding.stage.changed:
    cloudevents_type: com.zoiko.id.onboarding.stage.changed.v1
    meaning: "A pilot enforcement stage was planned or activated (scope risk ceiling, status)."
    source: ZID-OVERLAY-001 §17-19; CR-015
    lane: domain
    source_status: "proposed"
  provisioning.lifecycle.changed:
    cloudevents_type: com.zoiko.id.provisioning.lifecycle.changed.v1
    meaning: "An HR lifecycle event (joiner, mover, leaver, leave start/end) was applied to a provisioned principal."
    source: ZID-OVERLAY-001 §10.1, §22; CR-015
    lane: domain
    source_status: "proposed"
  integration.connector.stale:
    cloudevents_type: com.zoiko.id.integration.connector.stale.v1
    meaning: "A connector's facts passed their freshness bound; health dropped to DEGRADED (high-risk use refused)."
    source: ZID-OVERLAY-001 §24, §31; CR-015
    lane: priority
    source_status: "proposed"
  tenant.failback.failed:
    cloudevents_type: com.zoiko.id.tenant.failback.failed.v1
    meaning: "A governed failback was blocked by a gate or aborted before cutover (operation id, step, canonical code)."
    source: ZID-RESILIENCE-001 §16, §20; CR-016
    lane: priority
    source_status: "proposed"
  restore.failed:
    cloudevents_type: com.zoiko.id.restore.failed.v1
    meaning: "A restore into an isolated recovery environment was blocked by a gate or aborted (operation id, step, code)."
    source: ZID-RESILIENCE-001 §16, §20; CR-016
    lane: priority
    source_status: "proposed"
  ops.incident.declared:
    cloudevents_type: com.zoiko.id.ops.incident.declared.v1
    meaning: "An incident was declared (severity, security flag, services, cells; no approval step)."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.incident.severity_changed:
    cloudevents_type: com.zoiko.id.ops.incident.severity_changed.v1
    meaning: "An incident's severity was raised or lowered (previous/new severity, reason commitment)."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.incident.updated:
    cloudevents_type: com.zoiko.id.ops.incident.updated.v1
    meaning: "An incident's status or role assignments changed."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.incident.resolved:
    cloudevents_type: com.zoiko.id.ops.incident.resolved.v1
    meaning: "An incident was resolved after validation (duration)."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.incident.closed:
    cloudevents_type: com.zoiko.id.ops.incident.closed.v1
    meaning: "An incident was closed after its post-incident review and verified action items."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.readiness_review.recorded:
    cloudevents_type: com.zoiko.id.ops.readiness_review.recorded.v1
    meaning: "A production readiness review was recorded for a service (ready or the number of blocking gates)."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.change_freeze.applied:
    cloudevents_type: com.zoiko.id.ops.change_freeze.applied.v1
    meaning: "A service change freeze was applied (reason code, optional incident)."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  ops.change_freeze.lifted:
    cloudevents_type: com.zoiko.id.ops.change_freeze.lifted.v1
    meaning: "A service change freeze was lifted under an approved platform.change.manage grant."
    source: ZID-SRE-001 §15-17, §23-24, §26; CR-017
    lane: domain
    source_status: "proposed"
  policy.release.changed:
    cloudevents_type: com.zoiko.id.policy.release.changed.v1
    meaning: "A tenant policy release changed: drafted, edited, validated, validation failed, reviewed or published (release id, change, content hash)."
    source: ZID-AUTHZ-001 §18-19; CR-018
    lane: domain
    source_status: "proposed"
  commercial.entitlement.changed:
    cloudevents_type: com.zoiko.id.commercial.entitlement.changed.v1
    meaning: "A tenant's plan entitlement changed: plan, price book version, state and effective date (ids and revisions only)."
    source: ZID-COM-001 §6, §29; CR-024
    lane: domain
    source_status: "proposed"
  commercial.price_book.approved:
    cloudevents_type: com.zoiko.id.commercial.price_book.approved.v1
    meaning: "A price book was approved by a second operator and became effective (version, effective date)."
    source: ZID-COM-001 §6, §12; CR-024
    lane: domain
    source_status: "proposed"
  commercial.meter_window.frozen:
    cloudevents_type: com.zoiko.id.commercial.meter_window.frozen.v1
    meaning: "A tenant billing window for one UTC month was frozen: meters closed, counts and hash totals recorded."
    source: ZID-COM-001 §7, §11; CR-025
    lane: domain
    source_status: "proposed"
  commercial.billable_event.adjusted:
    cloudevents_type: com.zoiko.id.commercial.billable_event.adjusted.v1
    meaning: "A billable-usage adjustment was approved or rejected by a second operator (meter, month, state)."
    source: ZID-COM-001 §7, §26; CR-025
    lane: domain
    source_status: "proposed"
  commercial.invoice.issued:
