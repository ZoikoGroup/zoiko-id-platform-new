  tool.execute:                     {min_risk_class: R2, min_evidence_class: E2, category: "agent tool call (raise per tool policy)", name_source: spec, owner: machine}
  # ---- R1 Standard: "normal workforce access, ordinary business writes" ----
  application.access:               {min_risk_class: R1, min_evidence_class: E1, category: "normal workforce access", name_source: proposed, owner: customer-application (PEP)}
  resource.write:                   {min_risk_class: R1, min_evidence_class: E1, category: "ordinary business write", name_source: proposed, owner: customer-application (PEP)}
  identity.read:                    {min_risk_class: R1, min_evidence_class: E1, category: "identity lookup", name_source: spec, owner: principal}
  organization.read:                {min_risk_class: R1, min_evidence_class: E1, category: "organization lookup", name_source: spec, owner: organization}
  # ---- R0 Low: "public/low-sensitivity reads, non-privileged preferences" ----
  preferences.update:               {min_risk_class: R0, min_evidence_class: E0, category: "non-privileged preference", name_source: proposed, owner: principal}
  public_metadata.read:             {min_risk_class: R0, min_evidence_class: E0, category: "public read", name_source: proposed, owner: configuration}
