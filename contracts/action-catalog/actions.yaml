  data.sensitive.read:              {min_risk_class: R2, min_evidence_class: E2, category: "sensitive data", name_source: proposed, owner: customer-application (PEP)}
  external.write:                   {min_risk_class: R2, min_evidence_class: E2, category: "external write", name_source: proposed, owner: customer-application (PEP)}
  verification.review.decide:       {min_risk_class: R2, min_evidence_class: E2, category: "manual verification review (VERIFY §16)", name_source: proposed, owner: verification, note: "CR-009"}
  verification.assertion.revoke:    {min_risk_class: R2, min_evidence_class: E2, category: "invalidate a verification assertion (VERIFY §18)", name_source: proposed, owner: verification, note: "CR-009"}
  authentication.recovery.assist:   {min_risk_class: R2, min_evidence_class: E2, category: "governed recovery case opened by support (AUTH §14)", name_source: proposed, owner: authentication, note: "CR-009"}
