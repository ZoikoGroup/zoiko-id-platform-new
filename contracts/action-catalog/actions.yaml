  #      high-value financial/admin agent action" (ARCH §11.1, REQ §4) ----
  tenant.identity_provider.change:  {min_risk_class: R3, min_evidence_class: E3, category: "IdP change", name_source: proposed, owner: federation}
  tenant.mfa_policy.change:         {min_risk_class: R3, min_evidence_class: E3, category: "MFA change", name_source: proposed, owner: authentication}
  data.bulk_export:                 {min_risk_class: R3, min_evidence_class: E3, category: "bulk export", name_source: proposed, owner: privacy}
  evidence.export:                  {min_risk_class: R3, min_evidence_class: E3, category: "bulk export (evidence)", name_source: spec, owner: evidence}
  authority.grant:                  {min_risk_class: R3, min_evidence_class: E3, category: "authority delegation", name_source: spec, owner: authority}
  authority.grant.delegate:         {min_risk_class: R3, min_evidence_class: E3, category: "authority delegation", name_source: proposed, owner: authority}
  credential.issue:                 {min_risk_class: R3, min_evidence_class: E3, category: "credential signing", name_source: proposed, owner: credential}
  payment.release:                  {min_risk_class: R3, min_evidence_class: E3, category: "high-value financial action", name_source: spec, owner: customer-application (PEP)}
  purchase.create:                  {min_risk_class: R3, min_evidence_class: E3, category: "high-value agent action (TCE example)", name_source: spec, owner: customer-application (PEP)}
  operator.jit.elevate:             {min_risk_class: R3, min_evidence_class: E3, category: "high-value admin action", name_source: proposed, owner: operator_access}
  signals.stream.manage:            {min_risk_class: R3, min_evidence_class: E3, category: "security signal stream (SIGNALS §26)", name_source: proposed, owner: signals, note: "CR-009"}
  security_state.override:          {min_risk_class: R3, min_evidence_class: E3, category: "governed security-state re-evaluation (SIGNALS §26)", name_source: proposed, owner: signals, note: "CR-009"}
  provisioning.source.manage:       {min_risk_class: R3, min_evidence_class: E3, category: "SCIM connector (can suspend every provisioned account)", name_source: proposed, owner: provisioning, note: "CR-009"}
  verification.profile.manage:      {min_risk_class: R3, min_evidence_class: E3, category: "verification profile release (VERIFY §21 protected admin)", name_source: proposed, owner: verification, note: "CR-009"}
