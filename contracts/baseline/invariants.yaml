# Non-negotiable architecture invariants (ZID-ARCH-002 §4). Phase A deliverable (docs/phases/phase-a-architecture-baseline.md).
# owner: Chief Architect. Changing an invariant needs a recorded decision and ARB re-approval.
#
# enforcement kinds:
#   architecture-test  executable guard that runs in CI today   ref = <test file>::<test function>
#   acceptance-test    end-to-end proof from docs/traceability/acceptance-tests.csv   ref = AT-xx
#   decision           the phase decision that implements it   ref = DEC-xx
# status:
#   enforced           every listed architecture-test exists and the invariant is fully covered by them
#   partial            some architecture-tests exist; the rest is proved later by the listed acceptance tests
#   planned            no executable guard yet; the owning phase must add one before its gate
# backend/app/tests/unit/test_baseline.py keeps this file honest (refs must exist, statuses must match).

invariants:
  INV-01:
    statement: "Identity is not an email address. Every actor has an immutable internal principal_id; identifiers are linked, versioned attributes."
    phase: C
    status: partial
    enforcement:
      - {kind: architecture-test, ref: "app/tests/unit/test_deployment_posture.py::test_external_subject_key_is_issuer_plus_subject"}
      - {kind: architecture-test, ref: "app/tests/unit/test_deployment_posture.py::test_email_match_never_auto_links_high_assurance_accounts"}
      - {kind: decision, ref: DEC-A1}

  INV-02:
    statement: "Authentication does not confer business authority. A valid login is only one input to an authorization decision."
    phase: C
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-C1}
      - {kind: decision, ref: DEC-E1}

  INV-03:
    statement: "No privilege amplification through delegation. A child grant is always an attenuation of one complete valid parent authority chain."
    phase: C
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-C1}
      - {kind: acceptance-test, ref: AT-02}

  INV-04:
    statement: "No union-of-partials authorization by default. A request must be satisfied by one complete valid chain unless an explicit composite-authority policy says otherwise."
    phase: C
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-C1}
      - {kind: acceptance-test, ref: AT-03}

  INV-05:
    statement: "AI never supplies authority. Models may classify, explain or recommend; deterministic policy and signed grants decide."
    phase: A
    status: enforced
    enforcement:
      - {kind: architecture-test, ref: "app/tests/unit/test_baseline.py::test_no_ai_model_sdk_in_authority_modules"}

  INV-06:
    statement: "R2/R3 actions re-evaluate at commit. Time-of-check cannot silently become time-of-use authority."
    phase: C
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-B1}
      - {kind: acceptance-test, ref: AT-09}

  INV-07:
    statement: "PostgreSQL remains the canonical transactional authority. Low-latency relationship stores and graphs are revisioned projections, never independent truth."
    phase: C
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-C1}
      - {kind: decision, ref: DEC-C4}
      - {kind: acceptance-test, ref: AT-05}

  INV-08:
    statement: "No standing Zoiko production data privilege. Human operational access is just-in-time, dual-controlled where sensitive and receipted."
    phase: F
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-F4}
      - {kind: acceptance-test, ref: AT-11}

  INV-09:
    statement: "No immutable store contains directly identifying personal data by default. Evidence uses keyed pseudonymous handles and segregated encrypted subject evidence."
    phase: F
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-F1}
      - {kind: acceptance-test, ref: AT-10}

  INV-10:
    statement: "No customer must replace an incumbent IdP to adopt Zoiko authority controls."
    phase: A
    status: partial
    enforcement:
      - {kind: architecture-test, ref: "app/tests/unit/test_deployment_posture.py::test_overlay_mode_never_requires_native_identity"}
      - {kind: decision, ref: DEC-A1}
      - {kind: acceptance-test, ref: AT-01}

  INV-11:
    statement: "No production dependency on an unfinished protocol is exposed as a frozen public API. Drafts are isolated behind adapters."
    phase: A
    status: enforced
    enforcement:
      - {kind: architecture-test, ref: "app/tests/unit/test_baseline.py::test_public_contracts_expose_no_draft_protocol"}
      - {kind: decision, ref: DEC-D3}

  INV-12:
    statement: "All high-risk limits that can be consumed (money, count, data volume, signing quota) are ledgered atomically, never inferred from eventually consistent events."
    phase: C
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-C5}
      - {kind: acceptance-test, ref: AT-04}

  INV-13:
    statement: "Tenant and cell context are server-derived from authenticated trust context, never trusted from a caller-supplied body field."
    phase: A
    status: partial
    enforcement:
      - {kind: architecture-test, ref: "app/tests/unit/test_baseline.py::test_tenant_is_never_read_from_caller_input"}
      - {kind: decision, ref: DEC-G3}

  INV-14:
    statement: "Security state changes propagate by risk-class SLO and are measured end-to-end from authoritative commit to enforcement."
    phase: B
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-B1}
      - {kind: acceptance-test, ref: AT-06}

  INV-15:
    statement: "Every material allow/deny decision is reconstructable by policy version, relation/grant revision, assurance state and evidence references."
    phase: F
    status: planned
    enforcement:
      - {kind: decision, ref: DEC-F2}
      - {kind: acceptance-test, ref: AT-10}
