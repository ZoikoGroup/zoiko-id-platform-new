# Architecture baseline gates (ZID-ARCH-002 §22-§24). Phase A deliverable.
# status: DRAFT (engineering baseline; pending ARB ratification)
# version: 0.1.0
# owner: Chief Architect; each item names the phase that must close it.
#
# entry status: open | in-progress | closed
# A closed item MUST carry an evidence link (test report, signed approval, dossier entry).
# "Narrative assurance" does not close a gate (§23.2): evidence is a link to a retained artifact.
# backend/app/tests/unit/test_baseline.py checks every reference and every closed item.

# The ten decisions the ARB must ratify (§23.1). Status lives in the phase files; this list only
# binds spec label -> decision so the BG-01 gate can be checked.
baseline_decisions:
  ADR-01: DEC-A1
  ADR-02: DEC-C1
  ADR-03: DEC-C2
  ADR-04: DEC-B1
  ADR-05: DEC-D3
  ADR-06: DEC-F1
  ADR-07: DEC-F3
  ADR-08: DEC-E2
  ADR-09: DEC-F6
  ADR-10: DEC-B2

