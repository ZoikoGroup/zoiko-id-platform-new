[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zoiko-verify"
version = "0.1.0"
description = "Verify your own customers with Zoiko iD from your own server: token (secret or private key), sessions, decisions and signed webhooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[tool.hatch.build.targets.wheel]
packages = ["src/zoiko_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
