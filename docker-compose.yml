# Zoiko iD — local development stack (LOCAL environment only; synthetic data only).
#   docker compose up --build -d      then open http://localhost:8000/docs
# One backend container from the single image (modular monolith, DEC-D6) the cell role
# as one process on one port:
#   cell   — all 27 cell modules, plus the global plane (tenant locator + discovery) -> http://localhost:8000
# DB password: set ZID_DB_PASSWORD in a .env file next to this file (compose reads it automatically).
# The fallback `zid_local_only` is for a developer laptop ONLY; any VM or shared host must set its own.
# Production gets short-lived credentials from the secrets broker instead (DEC-F5).
# Postgres is published on 127.0.0.1 only, never on a public interface.
#
# Only backend services run in Docker. The frontends (frontend/apps/web, frontend/apps/operator)
# run on the host with `npm run dev`.
#   --profile events   Redpanda (Kafka API) + outbox relay + event consumer
#   --profile idp      Keycloak as a stand-in external enterprise IdP (overlay demo)
#   --profile spire    SPIFFE/SPIRE development profile
#   --profile backbone-tests   SpiceDB + a host-reachable Kafka broker for the backbone tests

name: zoiko-id

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: zid
      POSTGRES_PASSWORD: ${ZID_DB_PASSWORD:-zid_local_only}
      POSTGRES_DB: zid_cell
    volumes:
      - ./backend/database/schemas/001_cell_schemas.sql:/docker-entrypoint-initdb.d/10_cell_schemas.sql:ro
      - ./backend/database/schemas/001_global_schemas.sql:/docker-entrypoint-initdb.d/20_global_schemas.sql:ro
      - ./backend/database/schemas:/zid/schemas:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:${ZID_DB_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zid -d zid_cell"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot schema migration (DEC-D1): runs every module's Alembic stream (cell and global plane) against the one
  # platform database, then exits. The API and worker start only after it succeeds. Production runs
  # the same step as the migration owner role (db_owner_migration), never a runtime role.
  migrate:
    image: zid/platform:local
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - zid_platform.entrypoints.migrate
    # Operator account settings (ZID_OPERATOR_*): the step creates the operator after the schema, when they are set.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
    restart: "no"
    healthcheck:
      disable: true

  backend:
    build:
      context: ./backend
      target: runtime
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sign-in, passkey and token settings (copy backend/.env.example). The `environment` entries
    # below win over the file, so the database URLs always point at the compose Postgres.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ROLES: cell
      ZID_SERVE_GLOBAL_PLANE: "true"   # locator + discovery on the same port, same database (own schema, no personal data)
      # People enter an image name (ghcr.io/acme/bot:1.4) and the console works the digest out from the registry, so nobody types a sha256.
      # Only the hosts named here are ever contacted; anonymous access only (a private image is registered by the build pipeline instead).
      ZID_BUILD_REGISTRIES: '["ghcr.io"]'
      ZID_ENVIRONMENT: local
      # Authenticated requests per tenant per minute (0 = off). Turn it off for single-tenant load tests.
      ZID_API_RATE_LIMIT_PER_MINUTE: ${ZID_API_RATE_LIMIT_PER_MINUTE:-600}
      ZID_CELL_ID: local-1
      # ENGINEERING DEFAULT for local development only: 30 days. The privacy officer sets the real value per deployment (ZID-GAP-001); a deployed cell with none set refuses uploads.
      ZID_UPLOAD_RETENTION_DAYS: ${ZID_UPLOAD_RETENTION_DAYS:-30}
      ZID_CELL_DATABASE_URL: postgresql+asyncpg://zid_runtime:${ZID_RUNTIME_PASSWORD:-zid_runtime_local_only}@postgres:5432/zid_cell   # runtime role: row-level security applies (see local/postgres/runtime_role.sql)
      # Shared contracts live outside the backend build context; mount them read-only (prod: ship as config).
      ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    volumes:
      - ./contracts:/app/contracts:ro
      - ./backend/config:/app/config:ro   # cells, residency profiles: edit and restart, no rebuild
      # Workload identity files, read-only, only used when the settings below are given (see local/workload/README.md). A folder that does not exist yet is
      # created empty; nothing reads it unless ZID_ATTESTOR_KEYS_FILE, ZID_MESH_PROXY_SECRET_FILE and ZID_SPIFFE_BUNDLE_FILES point into it.
      - ./local/workload/.keys:/run/attestor:ro   # the attestor's public keys
      - ./local/workload/.proxy:/run/proxy:ro     # the secret the workload listener adds to what it forwards
      - ./local/spire:/app/spire:ro               # the SPIRE trust bundle
    ports:
      - "8000:8000"   # the only port: the cell role and the global plane

  # Background worker (DEC-D6): evidence sequencing + signed checkpoints, operator-grant expiry,
  # privacy retention sweep (Phase F). Locally it uses the owner role; deployed cells give it the
  # dedicated BYPASSRLS worker role (ZID_WORKER_DATABASE_URL), never the API's runtime role.
  worker:
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_ID: local-1
      ZID_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    volumes:
      - ./contracts:/app/contracts:ro
    command: ["python", "-m", "zid_platform.entrypoints.worker"]
    healthcheck:
      disable: true

  # Real malware scanner for evidence uploads and proof documents (ClamAV, free and open source):
  #   docker compose --profile scan up -d clamd    then set ZID_PROOF_SCANNER_ADDRESS=clamd:3310 on the backend
  # Without it a local cell uses the EICAR simulator (environment local or test only); a deployed cell with no scanner refuses uploads.
  clamd:
    profiles: ["scan"]
    image: clamav/clamav:stable
    restart: unless-stopped
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  # OCR for the document extraction route (Tesseract, free and open source), in its own sandbox so the backend links no imaging library:
  #   docker compose --profile ocr up -d --build ocr    then set ZID_OCR_URL=http://ocr:8090 on the backend (http://127.0.0.1:8090 from the host)
  # Without it the extraction route answers 503 for an image: nothing is read and nothing is guessed.
  ocr:
    profiles: ["ocr"]
    build: ./tools/ocr-sidecar
    restart: unless-stopped
    ports: ["127.0.0.1:8090:8090"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128

  # Session store for the frontends (DEC-H1). The frontends run on the host and reach it here.
  valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Event platform (DEC-D2), Kafka API served by Redpanda (one container, no ZooKeeper):
  #   docker compose --profile events up -d
  redpanda:
    profiles: ["events"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0
      --check=false --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
  outbox-relay:
    profiles: ["events"]
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_ID: local-1
      ZID_RELAY_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_KAFKA_BOOTSTRAP: redpanda:9092
    command: ["python", "-m", "zid_platform.entrypoints.outbox_relay"]
    healthcheck:
      disable: true
  consumer:
    profiles: ["events"]
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_ID: local-1
      ZID_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_KAFKA_BOOTSTRAP: redpanda:9092
      ZID_KAFKA_CREATE_TOPICS: "true"
      ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    volumes:
      - ./contracts:/app/contracts:ro
    command: ["python", "-m", "zid_platform.entrypoints.consumer"]
    healthcheck:
      disable: true

  # Disposable dependencies for the backbone tests (P0-04 stale-projection proof, event flow): SpiceDB with an
  # in-memory datastore, and a Kafka-API broker reachable from the host. Test use only.
  #   docker compose --profile backbone-tests up -d spicedb-test redpanda-test
  #   ZID_TEST_SPICEDB_URL=http://localhost:8443 ZID_TEST_KAFKA=localhost:19092 pytest app/tests/component
  spicedb-test:
    profiles: ["backbone-tests"]
    image: authzed/spicedb:v1.39.1
    command: ["serve", "--grpc-preshared-key", "test-key", "--http-enabled", "--datastore-engine", "memory"]
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:50051:50051"]
  redpanda-test:
    profiles: ["backbone-tests"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false
      --kafka-addr external://0.0.0.0:19092 --advertise-kafka-addr external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]

  # Stand-in external enterprise IdP for the overlay demo (replaces Entra ID / Okta / ADFS locally):
  #   docker compose --profile idp up -d      -> http://localhost:8180 (admin / admin, LOCAL ONLY)
  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
    volumes:
      - ./local/keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
    ports: ["127.0.0.1:8180:8180"]

  # SPIFFE/SPIRE development profile (DEC-F7): `docker compose --profile spire up -d`, then
  # `sh local/spire/bootstrap.sh`. Not started by default.
  spire-server:
    profiles: ["spire"]
    image: ghcr.io/spiffe/spire-server:1.13.2
    user: "0:0"   # local profile only: a fresh named volume is root-owned and the image's own user cannot open the sqlite file
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./local/spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server:/run/spire/data
  spire-agent:
    profiles: ["spire"]
    image: ghcr.io/spiffe/spire-agent:1.13.2
    depends_on: [spire-server]
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    volumes:
      - ./local/spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-sockets:/run/spire/sockets

  # Local workload identity (profile `workload`; see local/workload/setup.sh). The listener checks a workload's SPIRE identity on the way in; the attestor
  # looks at the running container through the engine's read-only socket and signs what it found. Both reach the cell, which runs from source on the host.
  # A stand-in agent to try workload identity with (development only; see local/workload/agent/Dockerfile). It builds and starts with the
  # stack. Its container name, label and user id are what local/workload/workloads.json and the SPIRE entry select on.
  invoice-agent:
    build: ./local/workload/agent
    image: acme/invoice-agent:1.0.0
    container_name: payments-agent
    labels:
      team: finance
    user: "10001"
    restart: unless-stopped

  workload-edge:
    profiles: ["workload"]
    image: caddy:2.8-alpine
    ports: ["127.0.0.1:9443:9443"]
    depends_on: [backend]
    # A fixed address: the cell trusts a forwarded certificate only from exactly this address AND with the shared secret (ZID_MESH_TRUSTED_PROXIES), the same
    # design as deploy/gcp-vm.
    networks:
      default:
        ipv4_address: 172.30.0.250
    volumes:
      - ./local/workload/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local/spire/bundle.pem:/run/secrets/spire_bundle.pem:ro
      - ./local/workload/.proxy/proxy_auth:/run/secrets/proxy_auth:ro

  attestor:
    profiles: ["workload"]
    image: zid/platform:local
    restart: unless-stopped
    depends_on: [backend]
    group_add: ["0"]   # Docker Desktop's engine socket belongs to root; a Linux host uses the docker group's number (see deploy/gcp-vm/README.md)
    command:
      - python
      - -m
      - zid_platform.entrypoints.attestor
      - run
      - --registrations=/etc/zid/workloads.json
      - --registered-docker
      - --docker-socket=/var/run/docker.sock
      - --key=/run/attestor/attestor.pem
      - --kid=attestor-1
      - --cell=http://backend:8000/v1/machine/attestations:verify
    volumes:
      - ./local/workload/workloads.json:/etc/zid/workloads.json:ro
      - ./local/workload/.keys:/run/attestor:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      disable: true

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24   # holds the workload listener's fixed address (172.30.0.250)

volumes:
  pgdata:
  redpanda:
  spire-server:
  spire-sockets:
