# Zoiko iD — local development stack (LOCAL environment only; synthetic data only).
#   docker compose up --build -d      then open http://localhost:8000/docs and http://localhost:8100/docs
# One backend container from the single image (modular monolith, DEC-D6) running both roles,
# each as its own process on its own port:
#   cell   — all 27 cell modules         -> http://localhost:8000
#   global — tenant locator + discovery  -> http://localhost:8100 (separate DB, no personal data)
# DB password: set ZID_DB_PASSWORD in a .env file next to this file (compose reads it automatically).
# The fallback `zid_local_only` is for a developer laptop ONLY; any VM or shared host must set its own.
# Production gets short-lived credentials from the secrets broker instead (DEC-F5).
# Postgres is published on 127.0.0.1 only, never on a public interface.
#
# Only backend services run in Docker. The frontends (frontend/apps/web, frontend/apps/operator)
# run on the host with `npm run dev`.
#   --profile events   Redpanda (Kafka API) + outbox relay + event consumer
#   --profile idp      Keycloak as a stand-in external enterprise IdP (overlay demo)
#   --profile spire    SPIFFE/SPIRE development profile
#   --profile backbone-tests   SpiceDB + a host-reachable Kafka broker for the backbone tests

name: zoiko-id

services:
  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: zid
      POSTGRES_PASSWORD: ${ZID_DB_PASSWORD:-zid_local_only}
      POSTGRES_DB: zid_cell
    volumes:
      - ./backend/database/schemas/001_cell_schemas.sql:/docker-entrypoint-initdb.d/10_cell_schemas.sql:ro
      - ./local/postgres/20_global_database.sh:/docker-entrypoint-initdb.d/20_global_database.sh:ro
      - ./backend/database/schemas:/zid/schemas:ro
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:${ZID_DB_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zid -d zid_global"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot schema migration (DEC-D1): runs every module's Alembic stream against the cell database and the
  # global plane's database, then exits. The API and worker start only after it succeeds. Production runs
  # the same step as the migration owner role (db_owner_migration), never a runtime role.
  migrate:
    image: zid/platform:local
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - zid_platform.entrypoints.migrate
    # Operator account settings (ZID_OPERATOR_*): the step creates the operator after the schema, when they are set.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_GLOBAL_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_global
    restart: "no"
    healthcheck:
      disable: true

  backend:
    build:
      context: ./backend
      target: runtime
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Sign-in, passkey and token settings (copy backend/.env.example). The `environment` entries
    # below win over the file, so the database URLs always point at the compose Postgres.
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ROLES: cell,global
      ZID_ENVIRONMENT: local
      # Authenticated requests per tenant per minute (0 = off). Turn it off for single-tenant load tests.
      ZID_API_RATE_LIMIT_PER_MINUTE: ${ZID_API_RATE_LIMIT_PER_MINUTE:-600}
      ZID_CELL_ID: local-1
      ZID_CELL_DATABASE_URL: postgresql+asyncpg://zid_runtime:${ZID_RUNTIME_PASSWORD:-zid_runtime_local_only}@postgres:5432/zid_cell   # runtime role: row-level security applies (see local/postgres/runtime_role.sql)
      ZID_GLOBAL_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_global
      # Shared contracts live outside the backend build context; mount them read-only (prod: ship as config).
      ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    volumes:
      - ./contracts:/app/contracts:ro
      - ./backend/config:/app/config:ro   # cells, residency profiles: edit and restart, no rebuild
    ports:
      - "8000:8000"   # cell role
      - "8100:8100"   # global role

  # Background worker (DEC-D6): evidence sequencing + signed checkpoints, operator-grant expiry,
  # privacy retention sweep (Phase F). Locally it uses the owner role; deployed cells give it the
  # dedicated BYPASSRLS worker role (ZID_WORKER_DATABASE_URL), never the API's runtime role.
  worker:
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_ID: local-1
      ZID_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    volumes:
      - ./contracts:/app/contracts:ro
    command: ["python", "-m", "zid_platform.entrypoints.worker"]
    healthcheck:
      disable: true

  # Session store for the frontends (DEC-H1). The frontends run on the host and reach it here.
  valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6380:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Event platform (DEC-D2), Kafka API served by Redpanda (one container, no ZooKeeper):
  #   docker compose --profile events up -d
  redpanda:
    profiles: ["events"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0
      --check=false --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
    volumes: [redpanda:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12
  outbox-relay:
    profiles: ["events"]
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_ID: local-1
      ZID_RELAY_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_KAFKA_BOOTSTRAP: redpanda:9092
    command: ["python", "-m", "zid_platform.entrypoints.outbox_relay"]
    healthcheck:
      disable: true
  consumer:
    profiles: ["events"]
    image: zid/platform:local
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      ZID_ENVIRONMENT: local
      ZID_CELL_ID: local-1
      ZID_DATABASE_URL: postgresql+asyncpg://zid:${ZID_DB_PASSWORD:-zid_local_only}@postgres:5432/zid_cell
      ZID_KAFKA_BOOTSTRAP: redpanda:9092
      ZID_KAFKA_CREATE_TOPICS: "true"
      ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    volumes:
      - ./contracts:/app/contracts:ro
    command: ["python", "-m", "zid_platform.entrypoints.consumer"]
    healthcheck:
      disable: true

  # Disposable dependencies for the backbone tests (P0-04 stale-projection proof, event flow): SpiceDB with an
  # in-memory datastore, and a Kafka-API broker reachable from the host. Test use only.
  #   docker compose --profile backbone-tests up -d spicedb-test redpanda-test
  #   ZID_TEST_SPICEDB_URL=http://localhost:8443 ZID_TEST_KAFKA=localhost:19092 pytest app/tests/component
  spicedb-test:
    profiles: ["backbone-tests"]
    image: authzed/spicedb:v1.39.1
    command: ["serve", "--grpc-preshared-key", "test-key", "--http-enabled", "--datastore-engine", "memory"]
    ports: ["127.0.0.1:8443:8443", "127.0.0.1:50051:50051"]
  redpanda-test:
    profiles: ["backbone-tests"]
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0 --check=false
      --kafka-addr external://0.0.0.0:19092 --advertise-kafka-addr external://localhost:19092
    ports: ["127.0.0.1:19092:19092"]

  # Stand-in external enterprise IdP for the overlay demo (replaces Entra ID / Okta / ADFS locally):
  #   docker compose --profile idp up -d      -> http://localhost:8180 (admin / admin, LOCAL ONLY)
  keycloak:
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8180"
    volumes:
      - ./local/keycloak/realm-acme.json:/opt/keycloak/data/import/realm-acme.json:ro
    ports: ["127.0.0.1:8180:8180"]

  # SPIFFE/SPIRE development profile (DEC-F7): `docker compose --profile spire up -d`, then
  # `sh local/spire/bootstrap.sh`. Not started by default.
  spire-server:
    profiles: ["spire"]
    image: ghcr.io/spiffe/spire-server:1.13.2
    user: "0:0"   # local profile only: a fresh named volume is root-owned and the image's own user cannot open the sqlite file
    command: ["-config", "/opt/spire/conf/server/server.conf"]
    volumes:
      - ./local/spire/server.conf:/opt/spire/conf/server/server.conf:ro
      - spire-server:/run/spire/data
  spire-agent:
    profiles: ["spire"]
    image: ghcr.io/spiffe/spire-agent:1.13.2
    depends_on: [spire-server]
    command: ["-config", "/opt/spire/conf/agent/agent.conf"]
    volumes:
      - ./local/spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - spire-sockets:/run/spire/sockets

volumes:
  pgdata:
  redpanda:
  spire-server:
  spire-sockets:
