# SPIRE agent — LOCAL DEVELOPMENT PROFILE ONLY (DEC-F7). Joins with a one-time join token minted by
# local/spire/bootstrap.sh; serves the Workload API on a unix socket shared with the backend.
agent {
    data_dir = "/run/spire/agent"
    log_level = "INFO"
    server_address = "spire-server"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "local-1.local.id.zoiko"
    insecure_bootstrap = true   # local only: deployed agents pin the trust bundle
}

plugins {
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "memory" { plugin_data {} }
    WorkloadAttestor "unix" { plugin_data {} }
}
