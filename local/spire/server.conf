# SPIRE server — LOCAL DEVELOPMENT PROFILE ONLY (DEC-F7 §1; `docker compose --profile spire up`).
# Deployed cells run a SPIRE server per cell with an HSM/KMS-backed upstream authority and a
# governed trust domain `<cell>.<environment>.id.zoiko`; nothing here is suitable for that.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "local-1.local.id.zoiko"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"      # short-lived, auto-renewed (DEC-F7 §4)
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }
    KeyManager "memory" { plugin_data {} }
    NodeAttestor "join_token" { plugin_data {} }
}
