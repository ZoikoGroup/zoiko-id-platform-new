# Admission: an image runs only if it is signed (cosign keyless) by the approved release workflow and carries
# SLSA provenance from the approved builder and source (DEC-G4 §5; DEVSEC-08, DEVSEC-09, DEVSEC-26).
# failurePolicy Fail + Enforce: if admission cannot evaluate, the workload is NOT admitted (fail closed).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: zid-verify-images
  annotations:
    policies.kyverno.io/title: Verify image signature and provenance
    policies.kyverno.io/category: Supply chain
spec:
  validationFailureAction: Enforce
  failurePolicy: Fail
  webhookTimeoutSeconds: 30
  background: false
  rules:
    - name: signed-by-release-workflow-with-provenance
      match:
        any:
          - resources:
              kinds: [Pod]
      verifyImages:
        - imageReferences:
            - "ghcr.io/zoikogroup/*"
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: "https://token.actions.githubusercontent.com"
                    subject: "https://github.com/ZoikoGroup/zoiko-id-platform-new/.github/workflows/build-image.yml@refs/heads/main"
                    rekor:
                      url: https://rekor.sigstore.dev
          attestations:
            - type: https://slsa.dev/provenance/v1
              attestors:
                - entries:
                    - keyless:
                        issuer: "https://token.actions.githubusercontent.com"
                        subject: "https://github.com/ZoikoGroup/zoiko-id-platform-new/.github/workflows/build-image.yml@refs/heads/main"
              conditions:
                - all:
                    - key: "{{ buildDefinition.externalParameters.workflow.repository }}"
                      operator: Equals
                      value: "https://github.com/ZoikoGroup/zoiko-id-platform-new"
                    - key: "{{ buildDefinition.externalParameters.workflow.ref }}"
                      operator: Equals
                      value: "refs/heads/main"
