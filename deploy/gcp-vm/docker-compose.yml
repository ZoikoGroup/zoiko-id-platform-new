# Zoiko iD on GCP virtual machines only: the APP VM. No KMS, no Cloud SQL, no managed service of any kind.
#   cp env.example .env && chmod 600 .env     # fill in (see README.md)
#   docker compose --profile edge up -d       # migrate runs first; add --profile events for the event relay and consumer
# Keys live in PostgreSQL, wrapped by a master key file kept outside it (ZID_KEY_PROVIDER=db, CR-060). The database, OpenBao,
# Kafka (Redpanda) and SpiceDB run on their own VMs (docker-compose.services.yml and README.md) and are reached by address.
# Everything secret is a root-owned file in ./secrets (master_key, openbao_token, smtp_password), never an environment value.
name: zoiko-id-vm

x-backend: &backend
  image: ${ZID_BACKEND_IMAGE}
  restart: unless-stopped
  env_file: [.env]
  environment: &backend-env
    ZID_ENVIRONMENT: production
    ZID_CELL_ID: ${ZID_CELL_ID}
    ZID_REGION: ${ZID_REGION}
    ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    # agents and mandates (CR-091 to CR-146). ZID_CELL_UUID is this cell's id in the ledger's writer fence (DEC-C5): without it no mandate can be
    # created and the access readiness agent cannot read mandates (DEPENDENCY_UNAVAILABLE), so it has no default. Choose it once per cell, never change it.
    ZID_CELL_UUID: ${ZID_CELL_UUID:?set ZID_CELL_UUID to this cell's UUID in .env (uuidgen; see env.example)}
    # enforce: a refusal is real (no live policy, no calls). shadow records what would be refused and lets the call through. The emergency stop applies in both.
    ZID_AGENT_GOVERNANCE: ${ZID_AGENT_GOVERNANCE:-enforce}
    # API-based agents ship OFF in production (CR-144) and are switched on by a named decision: set ZID_API_AGENTS=on in .env. An API agent needs no image or attestor.
    ZID_API_AGENTS: ${ZID_API_AGENTS:-off}
    # the access readiness agent (CR-091): off until enabled, and runs only in the cells named here (this cell).
    ZID_ACCESS_READINESS_ENABLED: ${ZID_ACCESS_READINESS_ENABLED:-false}
    ZID_ACCESS_READINESS_REGIONS: '["${ZID_CELL_ID}"]'
    # keys in the database, wrapped by the master key file. A deployed environment refuses to start without the written acceptance,
    # so it has no default here: set ZID_KEY_PROVIDER_DB_ACK=accept-software-keys in .env only after the Security Lead signed CR-060.
    ZID_KEY_PROVIDER: db
    ZID_KEY_MASTER_FILE: /run/secrets/master_key
    ZID_KEY_PROVIDER_DB_ACK: ${ZID_KEY_PROVIDER_DB_ACK:?set ZID_KEY_PROVIDER_DB_ACK=accept-software-keys after CR-060 is accepted}
    # secrets: OpenBao on the services VM (stored in PostgreSQL), a periodic token read from a file
    ZID_SECRET_BROKER: ${ZID_SECRET_BROKER:-openbao}
    ZID_OPENBAO_ADDR: http://${ZID_SERVICES_HOST}:8200
    ZID_OPENBAO_AUTH: token
    ZID_OPENBAO_TOKEN_FILE: /run/secrets/openbao_token
    ZID_TOKEN_ISSUER: ${ZID_TOKEN_ISSUER_URL:-https://api.${ZID_DOMAIN}}
    ZID_TOKEN_AUDIENCE: ${ZID_TOKEN_AUDIENCE_URL:-https://api.${ZID_DOMAIN}}
    ZID_PUBLIC_BASE_URL: https://api.${ZID_DOMAIN}
    ZID_CONSENT_URL: https://id.${ZID_DOMAIN}/consent
    ZID_WEBAUTHN_RP_ID: ${ZID_DOMAIN}
    ZID_WEBAUTHN_RP_NAME: Zoiko iD
    ZID_WEBAUTHN_ORIGINS: '["https://id.${ZID_DOMAIN}"]'
    ZID_TENANT_SIGNUP_ENABLED: "true"
    ZID_TENANT_CONSOLE_REDIRECT_URIS: '["https://id.${ZID_DOMAIN}/auth/callback"]'
    ZID_REGISTRATION_TENANT_ID: ${ZID_REGISTRATION_TENANT_ID:-}
    ZID_EMAIL_PUBLIC_BASE_URL: https://id.${ZID_DOMAIN}
    ZID_EMAIL_ENABLED: "true"
    ZID_EMAIL_ENABLED_TEMPLATES: ${ZID_EMAIL_ENABLED_TEMPLATES:-["*"]}
    ZID_EMAIL_FROM: ${ZID_EMAIL_FROM}
    ZID_SMTP_HOST: ${ZID_SMTP_HOST}
    ZID_SMTP_PORT: ${ZID_SMTP_PORT:-587}
    ZID_SMTP_USERNAME: ${ZID_SMTP_USERNAME}
    ZID_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    # the malware scanner for company proof documents; unset, uploads are refused (nothing is stored unscanned)
    ZID_PROOF_SCANNER_ADDRESS: ${ZID_PROOF_SCANNER_ADDRESS:-}
    ZID_KAFKA_BOOTSTRAP: ${ZID_SERVICES_HOST}:9092
    # workload identity (profile `workload-identity`, README section 8): trust this cell's SPIRE bundle, accept a forwarded client
    # certificate only from the workload listener's fixed address, and verify attestor statements against the attestor's public key.
    # Unset, workloads get no identity (the cell answers 503) and the attestation endpoint is 404.
    ZID_SPIFFE_TRUST_DOMAIN: ${ZID_SPIFFE_TRUST_DOMAIN:-}
    ZID_SPIFFE_BUNDLE_FILES: ${ZID_SPIFFE_BUNDLE_FILES:-{}}
    ZID_MESH_TRUSTED_PROXIES: ${ZID_MESH_TRUSTED_PROXIES:-[]}
    ZID_MESH_PROXY_SECRET_FILE: ${ZID_MESH_PROXY_SECRET_FILE:-}
    ZID_ATTESTOR_KEYS_FILE: ${ZID_ATTESTOR_KEYS_FILE:-}
  volumes:
    - ../../contracts:/app/contracts:ro
    - ../../backend/config:/app/config:ro
    - ./secrets:/run/secrets:ro

services:
  valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${ZID_VALKEY_PASSWORD}"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"${ZID_VALKEY_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      retries: 10

  # One-shot schema migration as the database OWNER role (never the runtime role), then exits.
  migrate:
    <<: *backend
    restart: "no"
    environment:
      <<: *backend-env
      ZID_CELL_DATABASE_URL: ${ZID_OWNER_CELL_DATABASE_URL}
      ZID_KEY_ACTOR: process:migrate
    command: ["python", "-m", "zid_platform.entrypoints.migrate"]
    healthcheck: {disable: true}

  cell:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ZID_ROLES: cell
      ZID_SERVE_GLOBAL_PLANE: "true"  # locator + discovery are served on this same port, from the same database
      # People enter an image name (ghcr.io/acme/bot:1.4) and the console works the digest out from the registry, so nobody types a sha256.
      # Only the hosts named here are ever contacted; anonymous access only (a private image is registered by the build pipeline instead).
      ZID_BUILD_REGISTRIES: '${ZID_BUILD_REGISTRIES:-["ghcr.io"]}'
      ZID_CELL_DATABASE_URL: ${ZID_RUNTIME_CELL_DATABASE_URL} # zid_runtime: row-level security applies
    expose: ["8000"]

  worker:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ZID_WORKER_DATABASE_URL: ${ZID_WORKER_DATABASE_URL} # dedicated worker role, never the API's runtime role
      ZID_KEY_ACTOR: process:worker # who the key audit trail names for changes this process makes
      ZID_METRICS_PORT: "9102" # the worker's scrape endpoint (evidence integrity, sealing lag); reachable on the private network only
      ZID_METRICS_BIND: 0.0.0.0
    command: ["python", "-m", "zid_platform.entrypoints.worker"]
    expose: ["9102"]
    healthcheck: {disable: true}

  web:
    image: ${ZID_WEB_IMAGE}
    restart: unless-stopped
    depends_on:
      valkey: {condition: service_healthy}
      cell: {condition: service_started}
    environment:
      ZID_CELL_API_URL: http://cell:8000
      ZID_TOKEN_ISSUER: ${ZID_TOKEN_ISSUER_URL:-https://api.${ZID_DOMAIN}}
      ZID_PUBLIC_ORIGIN: https://id.${ZID_DOMAIN}
      ZID_OAUTH_CLIENT_ID: zoiko-web
      ZID_OAUTH_REDIRECT_URI: https://id.${ZID_DOMAIN}/auth/callback
      ZID_ENVIRONMENT: production
      ZID_VALKEY_URL: redis://:${ZID_VALKEY_PASSWORD}@valkey:6379
    expose: ["3000"]

  # The event platform's two processes (profile `events`): they need Kafka and SpiceDB on the services VM.
  outbox-relay:
    profiles: ["events"]
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ZID_RELAY_DATABASE_URL: ${ZID_RELAY_DATABASE_URL:-}
    command: ["python", "-m", "zid_platform.entrypoints.outbox_relay"]
    healthcheck: {disable: true}

  consumer:
    profiles: ["events"]
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ZID_KAFKA_CREATE_TOPICS: "true"
      ZID_DATABASE_URL: ${ZID_RUNTIME_CELL_DATABASE_URL}
      ZID_SPICEDB_URL: http://${ZID_SERVICES_HOST}:8443
      ZID_SPICEDB_KEY: ${ZID_SPICEDB_PRESHARED_KEY}
    command: ["python", "-m", "zid_platform.entrypoints.consumer"]
    healthcheck: {disable: true}

  # The public edge (profile `edge`): Caddy gets and renews the certificates by itself and publishes 80 and 443.
  # Operator Console (profile `operator`): the same image the release workflow builds and signs (build-frontend-image.yml, app=operator). Its own origin
  # operator.<domain> and OAuth client. Add that origin to ZID_WEBAUTHN_ORIGINS in .env first, and keep it behind OPERATOR_ALLOWED_CIDRS (Caddyfile) or IAP.
  operator:
    profiles: ["operator"]
    image: ${ZID_OPERATOR_IMAGE:-}
    restart: unless-stopped
    depends_on:
      valkey: {condition: service_healthy}
      cell: {condition: service_started}
    environment:
      ZID_CELL_API_URL: http://cell:8000
      ZID_TOKEN_ISSUER: ${ZID_TOKEN_ISSUER_URL:-https://api.${ZID_DOMAIN}}
      ZID_PUBLIC_ORIGIN: https://operator.${ZID_DOMAIN}
      ZID_OAUTH_CLIENT_ID: zoiko-operator
      # where a customer who opened the operator sign-in by mistake is sent (the company site). The company site never links to this one.
      ZID_COMPANY_SIGN_IN_URL: https://id.${ZID_DOMAIN}/sign-in
      ZID_OAUTH_REDIRECT_URI: https://operator.${ZID_DOMAIN}/auth/callback
      ZID_ENVIRONMENT: production
      ZID_VALKEY_URL: redis://:${ZID_VALKEY_PASSWORD}@valkey:6379
    expose: ["3000"]

  # Identity-check sidecars (profile `idv`), run the same way as the local stack: hardened, read-only, no capabilities, no network of their own beyond this one.
  #   ocr   reads the printed lines of a document (company certificate check, identity documents)   -> .env: ZID_OCR_URL=http://ocr:8090
  #   face  the face-match lab engine (no liveness, never an approval)                               -> .env: ZID_FACE_URL=http://face:8091
  #   clamd the malware scanner every company proof upload goes through                              -> .env: ZID_PROOF_SCANNER_ADDRESS=clamd:3310
  # ZID_OCR_IMAGE and ZID_FACE_IMAGE are built and signed by the release workflow (build-sidecar-image.yml); ./deploy.sh verifies them by digest.
  ocr:
    profiles: ["idv"]
    image: ${ZID_OCR_IMAGE:-}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
    expose: ["8090"]

  face:
    profiles: ["idv"]
    image: ${ZID_FACE_IMAGE:-}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128
    expose: ["8091"]

  clamd:
    profiles: ["idv"]
    image: clamav/clamav:stable
    restart: unless-stopped
    mem_limit: 2g
    expose: ["3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  caddy:
    profiles: ["edge"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      ZID_DOMAIN: ${ZID_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      OPERATOR_ALLOWED_CIDRS: ${OPERATOR_ALLOWED_CIDRS:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [web, cell]

  # ---- Workload identity (profile `workload-identity`): the same flow as local/spire, on a VM ---------------------------------------
  # The SPIRE agent gives each workload on THIS VM its identity over a unix socket. It shares the host's process table (`pid: host`) so
  # it can see which user a caller runs as. The first start needs a one-time join token (ZID_SPIRE_JOIN_TOKEN, README section 8).
  spire-agent:
    profiles: ["workload-identity"]
    image: ghcr.io/spiffe/spire-agent:1.13.2
    restart: unless-stopped
    pid: host
    command: ["-config", "/opt/spire/conf/agent/agent.conf", "-expandEnv"]
    environment:
      ZID_SPIFFE_TRUST_DOMAIN: ${ZID_SPIFFE_TRUST_DOMAIN:-}
      ZID_SERVICES_HOST: ${ZID_SERVICES_HOST}
      ZID_SPIRE_JOIN_TOKEN: ${ZID_SPIRE_JOIN_TOKEN:-}
    volumes:
      - ./spire/agent.conf:/opt/spire/conf/agent/agent.conf:ro
      - ./secrets/spire_bundle.pem:/run/secrets/spire_bundle.pem:ro
      - spire-agent-data:/run/spire/agent
      - ${ZID_SPIRE_SOCKET_DIR:-/run/zid/spire-sockets}:/run/spire/sockets

  # The attestor is its own trust boundary: it looks at the running container through the engine's read-only socket and signs what it
  # found. It has its OWN key (./attestor-secrets, not ./secrets) and none of the cell's secrets: a compromised cell cannot mint
  # evidence. Registrations (which container may be what) change by reviewed change to attestor/workloads.json.
  attestor:
    profiles: ["workload-identity"]
    image: ${ZID_BACKEND_IMAGE}
    restart: unless-stopped
    depends_on: [cell]
    group_add: ["${ZID_DOCKER_GID:-999}"]   # the host's docker group (`getent group docker`): read access to the engine socket only
    command:
      - python
      - -m
      - zid_platform.entrypoints.attestor
      - run
      - --registrations=/etc/zid/workloads.json
      - --registered-docker
      - --docker-socket=/var/run/docker.sock
      - --key=/run/attestor/attestor.pem
      - --kid=${ZID_ATTESTOR_KID:-attestor-1}
      - --cell=http://cell:8000/v1/machine/attestations:verify
    volumes:
      - ./attestor/workloads.json:/etc/zid/workloads.json:ro
      - ./attestor-secrets:/run/attestor:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck: {disable: true}

  # Where a workload's identity is checked on the way in (Caddyfile.workload). Fixed address: the cell trusts a forwarded
  # certificate only from exactly this address (ZID_MESH_TRUSTED_PROXIES='["172.30.0.250"]').
  workload-edge:
    profiles: ["workload-identity"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["${ZID_WORKLOAD_BIND:-127.0.0.1}:9443:9443"]
    environment:
      ZID_DOMAIN: ${ZID_DOMAIN}
    volumes:
      - ./Caddyfile.workload:/etc/caddy/Caddyfile:ro
      - ./secrets/spire_bundle.pem:/run/secrets/spire_bundle.pem:ro
      - ./secrets/mesh_proxy_secret:/run/secrets/mesh_proxy_secret:ro
      - workload-edge-data:/data
    depends_on: [cell]
    networks:
      default:
        ipv4_address: 172.30.0.250

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  valkey-data:
  caddy-data:
  caddy-config:
  spire-agent-data:
  workload-edge-data:
