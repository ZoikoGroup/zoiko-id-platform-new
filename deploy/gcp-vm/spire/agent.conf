# SPIRE agent for the VM deployment, one per VM that runs workloads (docker-compose.yml, profile `workload-identity`), started with
# `-expandEnv` so ${...} below come from that compose file's environment.
#
# What is different from the local profile (local/spire/agent.conf):
#   * the agent PINS the server's trust bundle (trust_bundle_path) instead of trusting the first server it meets (no insecure_bootstrap);
#     the same file, secrets/spire_bundle.pem, is the one the cell and the Caddy workload listener trust;
#   * the join token comes from the environment and is needed only for the first start: once the agent holds its identity in data_dir,
#     the token is spent and ZID_SPIRE_JOIN_TOKEN is removed from .env;
#   * the Workload API socket is on the host (a bind mount), so workload containers can mount it and nothing else.
agent {
    data_dir = "/run/spire/agent"
    log_level = "INFO"
    server_address = "${ZID_SERVICES_HOST}"
    server_port = "8081"
    socket_path = "/run/spire/sockets/agent.sock"
    trust_domain = "${ZID_SPIFFE_TRUST_DOMAIN}"
    trust_bundle_path = "/run/secrets/spire_bundle.pem"
    join_token = "${ZID_SPIRE_JOIN_TOKEN}"
}

plugins {
    NodeAttestor "join_token" { plugin_data {} }
    KeyManager "disk" { plugin_data { directory = "/run/spire/agent" } }
    # A workload is identified by the unix user it runs as (the agent shares the host's process table: compose sets `pid: host`).
    WorkloadAttestor "unix" { plugin_data {} }
}
