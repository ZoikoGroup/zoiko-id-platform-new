# SPIRE server for the VM deployment (the same flow as local/spire, hardened for a deployed cell). Run on the SERVICES VM by
# docker-compose.services.yml with `-expandEnv`, so ${...} below come from that compose file's environment.
#
# What is different from the local profile (local/spire/server.conf):
#   * the trust domain is this cell's governed domain <cell>.<environment>.id.zoiko, from ZID_SPIFFE_TRUST_DOMAIN (never a default);
#   * the CA signing key is kept on disk (KeyManager "disk") so a restart keeps the same CA and every issued identity stays valid;
#     with no KMS or HSM on a VM-only deployment, that file is the CA's secret: mode 600, owner 1000, on an encrypted, snapshotted disk;
#   * the datastore is a sqlite file in the same directory: back the directory up with the VM's disk snapshots.
server {
    bind_address = "0.0.0.0"
    bind_port = "8081"
    trust_domain = "${ZID_SPIFFE_TRUST_DOMAIN}"
    data_dir = "/run/spire/data"
    log_level = "INFO"
    ca_ttl = "24h"
    default_x509_svid_ttl = "1h"      # short-lived, renewed by the agent (DEC-F7 section 4)
    default_jwt_svid_ttl = "5m"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/run/spire/data/datastore.sqlite3"
        }
    }
    KeyManager "disk" {
        plugin_data {
            keys_path = "/run/spire/data/keys.json"
        }
    }
    # An agent proves itself with a one-time token that the operator mints on this VM (workload-identity.sh token).
    NodeAttestor "join_token" { plugin_data {} }
}
