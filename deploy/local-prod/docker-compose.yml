# Zoiko iD: a LOCAL REHEARSAL of the production deployment on virtual machines (deploy/gcp-vm), from the real images.
#   ./rehearse.sh up        build the images, set up the databases the production way, start everything
#   ./rehearse.sh status    what is running and healthy
#   ./rehearse.sh down      stop (data stays);  ./rehearse.sh reset  stop and delete all data and generated secrets
#
# The backend runs with ZID_ENVIRONMENT=production. Keys live in PostgreSQL, wrapped by a master key held outside it
# (ZID_KEY_PROVIDER=db, CR-060); there is no KMS. Every service below is one VM (or one process on a VM) in the real deployment:
#   postgres  database VM                       valkey    web-session cache (rebuildable, holds no business data)
#   openbao   secrets VM (stores in Postgres)   redpanda  Kafka VM (the event platform)
#   spicedb   relationship store (stores in Postgres; the event consumer projects into it)
#   cell / worker / outbox-relay / consumer / web   the app VM(s)         email   sent through the real SMTP provider in .env.smtp
# Not rehearsed: the public edge (Caddy and TLS certificates), DNS, and the second database VM (standby). Synthetic data only.
name: zoiko-id-rehearsal

x-backend: &backend
  image: zid/platform:prodlocal
  restart: unless-stopped
  init: true # a tiny init as process 1 reaps finished child processes: without it a zombie worker could not be stopped and froze Docker (20 Nov 2026)
  env_file: [.env]
  environment: &backend-env
    ZID_ENVIRONMENT: production
    ZID_CELL_ID: local-1
    # This cell's id in the ledger's writer fence (DEC-C5). Without it a mandate cannot be created and the access readiness agent cannot read mandates
    # (DEPENDENCY_UNAVAILABLE). Pick it once and never change it: mandates record it as their home cell.
    ZID_CELL_UUID: 00000000-0000-7000-8000-000000000001
    ZID_REGION: local-dev
    ZID_ACTION_CATALOG: /app/contracts/action-catalog/actions.yaml
    # keys: in the database, wrapped by a master key kept outside it (CR-060). Deployed environments need the written acceptance.
    ZID_KEY_PROVIDER: db
    ZID_KEY_MASTER_FILE: /zid/master_key
    ZID_KEY_PROVIDER_DB_ACK: accept-software-keys
    # Evidence checkpoints are timestamped by an RFC 3161 authority and the token is verified against its root before it is kept (CR-060). The rehearsal runs its OWN
    # authority (the `tsa` service: it trusts nobody but this machine, and nothing leaves it), so the production path runs for real and the no-timestamp waiver is gone.
    # A real deployment points ZID_EVIDENCE_TSA_URL at an authority the owners chose and contracted, and ZID_EVIDENCE_TSA_TRUST_FILE at that authority's root.
    ZID_EVIDENCE_TSA_URL: http://tsa:8318/
    ZID_EVIDENCE_TSA_TRUST_FILE: /tsa/ca.pem
    # secrets: OpenBao (itself stored in PostgreSQL), reached with a periodic token read from a file
    ZID_SECRET_BROKER: ${ZID_SECRET_BROKER:-openbao}
    ZID_OPENBAO_ADDR: http://openbao:8200
    ZID_OPENBAO_AUTH: token
    ZID_OPENBAO_TOKEN_FILE: /zid/openbao_token
    # public addresses
    ZID_TOKEN_ISSUER: ${ZID_TOKEN_ISSUER_URL:-http://localhost:8000}
    ZID_TOKEN_AUDIENCE: ${ZID_TOKEN_AUDIENCE_URL:-http://localhost:8000}
    ZID_PUBLIC_BASE_URL: http://localhost:8000
    ZID_CONSENT_URL: http://localhost:3000/consent
    ZID_WEBAUTHN_RP_ID: localhost
    ZID_WEBAUTHN_RP_NAME: Zoiko iD (rehearsal)
    ZID_WEBAUTHN_ORIGINS: '["http://localhost:3000","http://localhost:3100"]'
    ZID_TENANT_SIGNUP_ENABLED: "true"
    # the agents (CR-091 to CR-094): Access Readiness, governance that denies for real, and DAARA. Not on by default anywhere.
    ZID_ACCESS_READINESS_ENABLED: "true"
    ZID_ACCESS_READINESS_REGIONS: '["local-1"]' # the cells it may run in; a cell not listed says "not available in this region"
    ZID_API_AGENTS: "on" # API-based agents are OFF in production unless this is set (CR-144); the rehearsal turns them on to test them
    ZID_AGENT_RUN_ROLE: zid_runtime # the worker runs each company's queued agent run AS the runtime role (row-level security applies), not as its own BYPASSRLS role (CR-142)
    ZID_AGENT_GOVERNANCE: enforce
    ZID_DAARA_ENABLED: "true"
    ZID_TENANT_CONSOLE_REDIRECT_URIS: '["http://127.0.0.1:3000/auth/callback"]'
    ZID_API_RATE_LIMIT_PER_MINUTE: "600"
    # events: Kafka (Redpanda). The relay and consumer run as their own processes
    ZID_KAFKA_BOOTSTRAP: redpanda:9092
    ZID_KAFKA_CREATE_TOPICS: "true"
    # email is sent through a real SMTP provider with TLS (production refuses a plaintext relay). The provider, sender and
    # login come from .env.smtp (gitignored; see rehearse.sh) and the password is a file on the secrets volume. There is no
    # test mail catcher: every email goes to its real recipient.
    ZID_EMAIL_ENABLED: "true"
    ZID_EMAIL_ENABLED_TEMPLATES: '["*"]'
    ZID_EMAIL_FROM: "${ZID_EMAIL_FROM:?set ZID_EMAIL_FROM in .env.smtp}"
    ZID_EMAIL_PUBLIC_BASE_URL: http://localhost:3000
    ZID_SMTP_HOST: "${ZID_SMTP_HOST:?set ZID_SMTP_HOST in .env.smtp}"
    ZID_SMTP_PORT: "${ZID_SMTP_PORT:?set ZID_SMTP_PORT in .env.smtp}"
    ZID_SMTP_USERNAME: "${ZID_SMTP_USERNAME:?set ZID_SMTP_USERNAME in .env.smtp}"
    ZID_SMTP_PASSWORD_FILE: /zid/smtp_password
    # identity checks (ZID-DTV-WF-03): the market policy is supplied from outside the image (the repo's own policy file ships with no market, on purpose),
    # the photo service reads the document's printed lines, and a real malware scanner checks every upload (a deployed cell with no scanner refuses uploads)
    ZID_IDV_POLICIES: /etc/zid/idv-policies.yaml
    ZID_OCR_URL: http://ocr:8090
    ZID_PROOF_SCANNER_ADDRESS: clamd:3310
    # the face-match lab engine (open source, no liveness, never an approval): used only by the Operator Console's Face lab until the engine gate is satisfied
    ZID_FACE_URL: http://face:8091
    # THE OWNER'S ACKNOWLEDGEMENT (CR-129): a market's WEB_FACE route approves a person on a live face against an uploaded document photograph, with no liveness test and no check that the
    # document is genuine. Delete this line to switch every face-match route off. It is a local test setting; set it nowhere that real people are verified without Legal and Privacy.
    ZID_IDV_FACE_ROUTE_ACK: accept-no-liveness-no-evaluation
    # LOCAL TEST ONLY: the owners' written acceptance of the built-in global identity policy (backend/config/idv/global-policy.yaml, values PROPOSED, not accepted by any owner). It lets a person verify from any
    # country on this machine. Never copy it to a stack where real people are verified without Privacy, Legal and Compliance accepting every value in that file.
    ZID_IDV_GLOBAL_POLICY_ACK: accept-global-idv-policy
    ZID_IDV_GLOBAL_POLICY: /app/config/idv/global-policy.yaml  # where the cell reads the global policy (the config folder is mounted at /app/config)
  volumes:
    - ../../contracts:/app/contracts:ro
    - ${ZID_CONFIG_DIR:-../../backend/config}:/app/config:ro # a local-only copy of the config (ZID_CONFIG_DIR in .env) for the rehearsal; the repository's folder by default
    - tsa-data:/tsa:ro # the timestamp authority's root (ca.pem), which a timestamp must chain to
    - keys:/zid:ro # master key, OpenBao token and SMTP password: root-only files on a real VM
    - ./idv-policies.local.yaml:/etc/zid/idv-policies.yaml:ro # the approved markets for identity checks: a test policy here, the owners' signed one on a real VM

services:
  # --- database VM ---------------------------------------------------------------------------------------------------------
  postgres:
    image: postgres:17.6-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ZID_PG_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${ZID_PG_HOST_PORT:-15432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- cache VM ------------------------------------------------------------------------------------------------------------
  valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--requirepass", "${ZID_VALKEY_PASSWORD}"]
    volumes: [valkey-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"${ZID_VALKEY_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      retries: 10

  # --- secrets VM: OpenBao keeps its data in PostgreSQL (database `openbao`), sealed with Shamir keys ------------------------
  openbao:
    image: openbao/openbao:2.1.1
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    command: ["server"]
    environment:
      BAO_LOCAL_CONFIG: |
        ui = false
        storage "postgresql" {
          connection_url = "postgres://openbao:${ZID_OPENBAO_DB_PASSWORD}@postgres:5432/openbao?sslmode=disable"
        }
        listener "tcp" {
          address = "0.0.0.0:8200"
          tls_disable = true
        }
        api_addr = "http://openbao:8200"
    ports: ["127.0.0.1:18200:8200"]

  # --- Kafka VM: Redpanda speaks the Kafka API -----------------------------------------------------------------------------
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.7
    restart: unless-stopped
    command: >
      redpanda start --overprovisioned --smp 1 --memory 512M --reserve-memory 0M --node-id 0
      --check=false --kafka-addr internal://0.0.0.0:9092 --advertise-kafka-addr internal://redpanda:9092
    volumes: [redpanda-data:/var/lib/redpanda/data]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- authorization relationships (SpiceDB keeps its data in PostgreSQL, database `spicedb`) ------------------------------
  spicedb-migrate:
    image: authzed/spicedb:v1.39.1
    restart: "no"
    command: ["migrate", "head", "--datastore-engine", "postgres",
              "--datastore-conn-uri", "postgres://spicedb:${ZID_SPICEDB_DB_PASSWORD}@postgres:5432/spicedb?sslmode=disable"]

  spicedb:
    image: authzed/spicedb:v1.39.1
    restart: unless-stopped
    depends_on:
      spicedb-migrate: {condition: service_completed_successfully}
    environment:
      SPICEDB_GRPC_PRESHARED_KEY: ${ZID_SPICEDB_PRESHARED_KEY}
    command: ["serve", "--http-enabled", "--datastore-engine", "postgres",
              "--datastore-conn-uri", "postgres://spicedb:${ZID_SPICEDB_DB_PASSWORD}@postgres:5432/spicedb?sslmode=disable"]

  # --- identity-check support services (the photo service and the malware scanner; both free and open source) -----------------------
  ocr:
    build: ../../tools/ocr-sidecar
    image: zid/ocr:prodlocal
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128

  face:
    build: ../../tools/face-sidecar
    image: zid/face:prodlocal
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    pids_limit: 128

  clamd:
    image: clamav/clamav:stable
    restart: unless-stopped
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  # --- app VM --------------------------------------------------------------------------------------------------------------
  # The files in /zid must belong to the unprivileged user the images run as (uid 10001) and be unreadable by anyone else.
  init-volumes:
    image: zid/platform:prodlocal
    user: "0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /zid && chmod 755 /zid"]
    volumes: [keys:/zid]
    restart: "no"

  # Operator tools, run on demand (`./rehearse.sh keys status`): the same image with the volume writable, to create the master
  # key and the secret files. On a real VM these are steps done once by a person.
  tools:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    volumes:
      - keys:/zid
    healthcheck: {disable: true}

  # One-shot schema migration as the database OWNER role (never the runtime role), then exits. The databases, roles and
  # namespaces already exist: rehearse.sh creates them the way the production guide does.
  migrate:
    <<: *backend
    restart: "no"
    depends_on:
      init-volumes: {condition: service_completed_successfully}
    environment:
      <<: *backend-env
      ZID_CELL_DATABASE_URL: postgresql+asyncpg://zid_owner:${ZID_OWNER_PASSWORD}@postgres:5432/zid_cell
      ZID_KEY_ACTOR: process:migrate
      # Operator Console sign-in (email and password, no passkey): the account is created by the migrate step from these.
      ZID_OPERATOR_MODE: direct
      ZID_OPERATOR_DIRECT_ACK: accept-no-dual-control  # one operator account, so no second approver exists (CR-035); remove both lines to require two people
      ZID_OPERATOR_TENANT_ID: "${ZID_OPERATOR_TENANT_ID:?set it in .env.operator}"
      ZID_OPERATOR_BOOTSTRAP_PRINCIPAL_ID: "${ZID_OPERATOR_BOOTSTRAP_PRINCIPAL_ID:?set it in .env.operator}"
      ZID_OPERATOR_CLIENT_IDS: '["zoiko-operator"]'
      ZID_OPERATOR_ORIGIN: http://127.0.0.1:3100
      ZID_OPERATOR_EMAIL: "${ZID_OPERATOR_EMAIL:?set it in .env.operator}"
      ZID_OPERATOR_PASSWORD: "${ZID_OPERATOR_PASSWORD:?set it in .env.operator}"
    command: ["python", "-m", "zid_platform.entrypoints.migrate"]
    healthcheck: {disable: true}

  # --- timestamp authority (RFC 3161): the rehearsal's own, offline, with its own root (see tsa/Dockerfile) -------------------------------------
  tsa:
    image: zid/tsa:prodlocal
    restart: unless-stopped
    volumes: [tsa-data:/data]

  cell:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      tsa: {condition: service_healthy}
    environment:
      <<: *backend-env
      ZID_ROLES: cell
      ZID_SERVE_GLOBAL_PLANE: "true"  # locator + discovery are served on this same port, from the same database
      # Operator Console sign-in (email and password, no passkey): the account is created by the migrate step from these.
      ZID_OPERATOR_MODE: direct
      ZID_OPERATOR_DIRECT_ACK: accept-no-dual-control  # one operator account, so no second approver exists (CR-035); remove both lines to require two people
      ZID_OPERATOR_TENANT_ID: "${ZID_OPERATOR_TENANT_ID:?set it in .env.operator}"
      ZID_OPERATOR_BOOTSTRAP_PRINCIPAL_ID: "${ZID_OPERATOR_BOOTSTRAP_PRINCIPAL_ID:?set it in .env.operator}"
      ZID_OPERATOR_CLIENT_IDS: '["zoiko-operator"]'
      ZID_OPERATOR_ORIGIN: http://127.0.0.1:3100
      ZID_OPERATOR_EMAIL: "${ZID_OPERATOR_EMAIL:?set it in .env.operator}"
      ZID_OPERATOR_PASSWORD: "${ZID_OPERATOR_PASSWORD:?set it in .env.operator}"
      # People enter an image name (ghcr.io/acme/bot:1.4) and the console works the digest out from the registry, so nobody types a sha256.
      # Only the hosts named here are ever contacted; anonymous access only (a private image is registered by the build pipeline instead).
      ZID_BUILD_REGISTRIES: '${ZID_BUILD_REGISTRIES:-["ghcr.io"]}'
      # the runtime role: row-level security applies, so one company can never read another's rows
      ZID_CELL_DATABASE_URL: postgresql+asyncpg://zid_runtime:${ZID_RUNTIME_PASSWORD}@postgres:5432/zid_cell
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      tsa: {condition: service_healthy}
    environment:
      <<: *backend-env
      # the dedicated worker role (BYPASSRLS: it sweeps every tenant), never the API's runtime role
      ZID_WORKER_DATABASE_URL: postgresql+asyncpg://zid_worker:${ZID_WORKER_PASSWORD}@postgres:5432/zid_cell
      ZID_KEY_ACTOR: process:worker # who the key audit trail names for changes this process makes
      ZID_METRICS_PORT: "9102" # the worker's scrape endpoint (evidence integrity, sealing lag); reachable on the private network only
      ZID_METRICS_BIND: 0.0.0.0
    command: ["python", "-m", "zid_platform.entrypoints.worker"]
    expose: ["9102"]
    healthcheck: {disable: true}

  outbox-relay:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}
    environment:
      <<: *backend-env
      # the dedicated relay role (BYPASSRLS, SELECT and UPDATE on the outbox only)
      ZID_RELAY_DATABASE_URL: postgresql+asyncpg://zid_relay:${ZID_RELAY_PASSWORD}@postgres:5432/zid_cell
    command: ["python", "-m", "zid_platform.entrypoints.outbox_relay"]
    healthcheck: {disable: true}

  consumer:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redpanda: {condition: service_healthy}
      spicedb: {condition: service_started}
    environment:
      <<: *backend-env
      ZID_DATABASE_URL: postgresql+asyncpg://zid_runtime:${ZID_RUNTIME_PASSWORD}@postgres:5432/zid_cell
      ZID_SPICEDB_URL: http://spicedb:8443
      ZID_SPICEDB_KEY: ${ZID_SPICEDB_PRESHARED_KEY}
    command: ["python", "-m", "zid_platform.entrypoints.consumer"]
    healthcheck: {disable: true}

  web:
    image: zid/web:prodlocal
    restart: unless-stopped
    depends_on:
      valkey: {condition: service_healthy}
      cell: {condition: service_started}
    environment:
      ZID_CELL_API_URL: http://cell:8000
      ZID_TOKEN_ISSUER: ${ZID_TOKEN_ISSUER_URL:-http://localhost:8000}
      ZID_PUBLIC_ORIGIN: http://localhost:3000
      ZID_OAUTH_CLIENT_ID: zoiko-web
      ZID_OAUTH_REDIRECT_URI: http://127.0.0.1:3000/auth/callback
      ZID_ENVIRONMENT: production
      ZID_VALKEY_URL: redis://:${ZID_VALKEY_PASSWORD}@valkey:6379
    ports: ["127.0.0.1:3000:3000"]

  # Operator Console: its own origin (3100) and OAuth client; operators sign in with email and password only.
  operator:
    image: zid/operator:prodlocal
    restart: unless-stopped
    depends_on:
      valkey: {condition: service_healthy}
      cell: {condition: service_started}
    environment:
      ZID_CELL_API_URL: http://cell:8000
      ZID_TOKEN_ISSUER: ${ZID_TOKEN_ISSUER_URL:-http://localhost:8000}
      ZID_PUBLIC_ORIGIN: http://localhost:3100
      ZID_OAUTH_CLIENT_ID: zoiko-operator
      ZID_COMPANY_SIGN_IN_URL: http://localhost:3000/sign-in  # where a customer who opened this page by mistake is sent
      ZID_OAUTH_REDIRECT_URI: http://127.0.0.1:3100/auth/callback
      ZID_ENVIRONMENT: production
      ZID_VALKEY_URL: redis://:${ZID_VALKEY_PASSWORD}@valkey:6379
    ports: ["127.0.0.1:3100:3000"]

volumes:
  pgdata:
  valkey-data:
  redpanda-data:
  keys:
  tsa-data:
