apiVersion: apps/v1
kind: Deployment
metadata:
  name: zid-platform-{{ .Values.role }}
  labels:
    app.kubernetes.io/name: zid-platform
    zid.zoiko.id/environment: {{ required "environment is required" .Values.environment }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: zid-platform
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zid-platform
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: platform
          image: "{{ .Values.image.repository }}@{{ required "image.digest (sha256:...) is required: promote by digest, never by tag" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: ZID_ROLES
              value: {{ .Values.role | quote }}
            - name: ZID_ENVIRONMENT
              value: {{ .Values.environment | quote }}
            - name: ZID_CELL_ID
              value: {{ required "cellId is required: name this cell's real region, for example uk-1, eu-1 or us-1" .Values.cellId | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
